<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">

<title>Nexora AI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================================================
   NEXORA AI
   PREMIUM MOBILE TELEGRAM MINI APP
   ========================================================= */

:root{
  --bg:#050505;
  --bg-soft:#090806;
  --card:#11100d;
  --card-soft:#15130f;

  --gold:#efd18a;
  --gold-light:#ffe9a8;
  --gold-dark:#b8934e;

  --white:#fff8e8;
  --muted:#aaa18e;
  --muted-dark:#6e685d;

  --border:rgba(239,209,138,.18);
  --border-strong:rgba(239,209,138,.30);

  --green:#83d6a1;
  --red:#dc8585;
}

/* RESET */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  width:100%;
  min-height:100%;
  background:#050505;
  overflow-x:hidden;
}

body{
  width:100%;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(239,209,138,.075),
      transparent 28%
    ),
    #050505;

  color:var(--white);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,
input{
  font-family:inherit;
}

button{
  border:0;
  outline:none;
}

button:active{
  transform:scale(.97);
}


/* =========================================================
   APP
   ========================================================= */

.app{
  width:100%;
  min-height:100vh;

  padding-bottom:
    calc(88px + env(safe-area-inset-bottom));

  background:
    linear-gradient(
      180deg,
      rgba(15,13,9,.45),
      rgba(5,5,5,.98)
    );
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
  display:none;
  width:100%;
  padding:20px 16px 25px;
}

.page.active{
  display:block;
}


/* =========================================================
   BRAND
   ========================================================= */

.brand{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.brand-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.logo{
  width:62px;
  height:62px;

  object-fit:cover;

  border-radius:20px;

  border:1px solid rgba(239,209,138,.34);

  box-shadow:
    0 0 22px rgba(239,209,138,.10);
}

.brand-name{
  color:var(--gold-light);

  font-size:24px;
  font-weight:850;

  letter-spacing:3px;
  line-height:1;
}

.brand-sub{
  margin-top:8px;

  color:#a59b87;

  font-size:9px;
  letter-spacing:3px;

  white-space:nowrap;
}

.brand-button{
  width:52px;
  height:52px;

  border-radius:18px;

  border:1px solid var(--border-strong);

  background:#0d0c09;

  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-button span{
  position:relative;

  width:22px;
  height:22px;

  border:2px solid var(--gold);

  border-radius:50%;
}

.brand-button span:before,
.brand-button span:after{
  content:"";

  position:absolute;

  background:var(--gold);
}

.brand-button span:before{
  width:4px;
  height:4px;

  border-radius:50%;

  left:7px;
  top:7px;
}

.brand-button span:after{
  width:28px;
  height:2px;

  left:-5px;
  top:8px;
}


/* =========================================================
   COMMON CARD
   ========================================================= */

.card{
  width:100%;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012)
    );

  border:1px solid var(--border);

  border-radius:24px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.42);
}


/* =========================================================
   BALANCE CARD
   ========================================================= */

.balance-card{

  /* IMPORTANT:
     No complicated SVG / filter / stacking here */

  position:relative;

  width:100%;

  min-height:300px;

  padding:25px 21px 20px;

  overflow:hidden;

  border-radius:30px;

  border:1px solid var(--border-strong);

  background:
    radial-gradient(
      circle at 85% 40%,
      rgba(239,209,138,.055),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      #15130f,
      #0d0c0a
    );
}


/* =========================================================
   PURE CSS USDT WATERMARK
   ========================================================= */

.usdt-watermark{

  position:absolute;

  width:205px;
  height:205px;

  right:-45px;
  bottom:-45px;

  border-radius:50%;

  border:7px solid rgba(239,209,138,.055);

  box-shadow:
    inset 0 0 0 8px rgba(239,209,138,.018);

  pointer-events:none;

  z-index:1;
}


/* second circle */

.usdt-watermark:before{

  content:"";

  position:absolute;

  width:165px;
  height:165px;

  left:13px;
  top:13px;

  border-radius:50%;

  border:2px solid rgba(239,209,138,.045);
}


/* T symbol */

.usdt-watermark:after{

  content:"T";

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-52%);

  color:rgba(239,209,138,.055);

  font-family:Arial,sans-serif;

  font-size:125px;
  font-weight:900;

  line-height:1;
}


/* =========================================================
   BALANCE CONTENT
   ========================================================= */

.balance-content{
  position:relative;

  z-index:5;
}

.balance-top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
}

.balance-title{
  color:#aaa18e;

  font-size:12px;
  font-weight:600;

  letter-spacing:1.8px;
}

.live{
  display:flex;
  align-items:center;
  gap:6px;

  padding:8px 11px;

  border-radius:30px;

  border:1px solid rgba(131,214,161,.28);

  background:rgba(131,214,161,.045);

  color:var(--green);

  font-size:9px;
  letter-spacing:1.2px;
}

.live-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 10px rgba(131,214,161,.75);

  animation:livePulse 1.5s infinite;
}

@keyframes livePulse{
  0%,100%{
    opacity:1;
    transform:scale(1);
  }

  50%{
    opacity:.45;
    transform:scale(.7);
  }
}

.balance-number{
  margin-top:18px;

  color:var(--gold-light);

  font-size:46px;
  font-weight:900;

  letter-spacing:-2px;

  line-height:1;
}

.balance-unit{
  margin-top:8px;

  color:#827a6d;

  font-size:9px;
  letter-spacing:1.6px;
}

.balance-info{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:8px;

  margin-top:25px;
}

.balance-info-box{
  padding:10px 7px;

  border-radius:13px;

  background:rgba(255,255,255,.022);

  border:1px solid rgba(239,209,138,.09);
}

.info-label{
  color:#716a5e;

  font-size:7px;
  letter-spacing:1px;
}

.info-value{
  margin-top:5px;

  color:#ddd4c1;

  font-size:10px;
  font-weight:750;
}

.green{
  color:var(--green)!important;
}

.balance-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:20px;
}

.btn{
  min-height:44px;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:7px;

  font-size:10px;
  font-weight:800;

  letter-spacing:.7px;
}

.btn-gold{
  color:#171209;

  background:
    linear-gradient(
      135deg,
      #ffe9a8,
      #cda55b
    );

  box-shadow:
    0 7px 22px rgba(239,209,138,.12);
}

.btn-dark{
  color:var(--gold-light);

  background:rgba(239,209,138,.035);

  border:1px solid var(--border);
}


/* =========================================================
   SECTION
   ========================================================= */

.section{
  margin-top:20px;
}

.section-title{
  margin:0 2px 10px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.section-title strong{
  font-size:14px;
  letter-spacing:.3px;
}

.section-title span{
  color:#686155;

  font-size:8px;
  letter-spacing:1.2px;
}


/* =========================================================
   MINING
   ========================================================= */

.mining-card{
  padding:19px;
}

.mining-head{
  display:flex;
  justify-content:space-between;
}

.mining-name{
  font-size:12px;
  font-weight:750;
  letter-spacing:.7px;
}

.mining-live{
  color:var(--green);

  font-size:9px;
}

.mining-number{
  margin-top:12px;

  color:var(--gold-light);

  font-size:27px;
  font-weight:850;
}

.mining-number small{
  color:#756e62;

  font-size:9px;
  font-weight:500;
}

.progress{
  height:5px;

  margin-top:15px;

  border-radius:20px;

  overflow:hidden;

  background:rgba(255,255,255,.055);
}

.progress span{
  display:block;

  width:64%;
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #a98343,
      #ffe9a8
    );
}

.mining-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:15px;
}

.mining-caption{
  color:#6e685d;

  font-size:8px;
}

.claim{
  padding:10px 13px;

  border-radius:11px;

  color:#171209;

  background:var(--gold);

  font-size:8px;
  font-weight:850;

  letter-spacing:.8px;
}


/* =========================================================
   CALCULATOR
   ========================================================= */

.calculator{
  padding:19px;
}

.calc-description{
  color:#80786a;

  font-size:9px;

  line-height:1.5;

  margin-bottom:15px;
}

.field{
  margin-bottom:11px;
}

.field-label{
  display:block;

  margin:0 0 6px 2px;

  color:#81796c;

  font-size:8px;
  letter-spacing:1px;
}

.input{
  width:100%;
  height:43px;

  padding:0 12px;

  color:var(--white);

  outline:none;

  border-radius:12px;

  border:1px solid var(--border);

  background:#0b0a08;

  font-size:12px;
}

.input:focus{
  border-color:rgba(239,209,138,.4);
}

.calc-two{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.results{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  margin-top:5px;
}

.result{
  padding:14px;

  border-radius:15px;

  border:1px solid rgba(239,209,138,.12);

  background:rgba(239,209,138,.035);
}

.result-label{
  color:#716a5e;

  font-size:7px;
  letter-spacing:1px;
}

.result-number{
  margin-top:7px;

  color:var(--gold-light);

  font-size:18px;
  font-weight:850;
}

.result-number small{
  color:#70695d;

  font-size:8px;
}


/* =========================================================
   QUICK ACCESS
   ========================================================= */

.quick-grid{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:7px;
}

.quick{
  min-height:83px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:8px;

  border-radius:17px;

  border:1px solid var(--border);

  background:
    rgba(255,255,255,.018);

  color:#d8cfbc;
}

.quick-icon{
  width:24px;
  height:24px;

  position:relative;

  color:var(--gold);
}

.quick-label{
  font-size:7px;
  letter-spacing:.3px;

  text-align:center;
}


/* =========================================================
   CHART
   ========================================================= */

.chart-card{
  padding:17px;
}

.tabs{
  display:flex;
  gap:6px;

  margin-bottom:15px;
}

.tab{
  padding:8px 11px;

  border-radius:10px;

  color:#756e62;

  background:#0d0c09;

  font-size:8px;
  letter-spacing:.7px;
}

.tab.active{
  color:#171209;

  background:var(--gold);
}

.chart{
  height:145px;

  display:flex;
  align-items:end;

  gap:7px;

  padding:8px 3px 0;

  border-bottom:1px solid rgba(239,209,138,.10);
}

.bar{
  flex:1;

  min-width:4px;

  border-radius:6px 6px 2px 2px;

  background:
    linear-gradient(
      180deg,
      #ffe9a8,
      #b58c46
    );

  animation:barShow .55s ease both;
}

@keyframes barShow{
  from{
    height:0!important;
    opacity:0;
  }

  to{
    opacity:1;
  }
}

.chart-labels{
  display:flex;

  justify-content:space-between;

  margin-top:8px;

  color:#5d574d;

  font-size:7px;
}


/* =========================================================
   TRANSACTIONS
   ========================================================= */

.transaction-card{
  padding:4px 17px;
}

.transaction{
  display:flex;

  align-items:center;

  gap:11px;

  padding:14px 0;

  border-bottom:1px solid rgba(255,255,255,.045);
}

.transaction:last-child{
  border-bottom:0;
}

.tx-icon{
  width:37px;
  height:37px;

  flex-shrink:0;

  border-radius:12px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold);

  background:rgba(239,209,138,.035);

  border:1px solid var(--border);
}

.tx-icon span{
  font-size:16px;
  font-weight:900;
}

.tx-info{
  flex:1;

  min-width:0;
}

.tx-name{
  font-size:10px;
  font-weight:750;
}

.tx-date{
  margin-top:4px;

  color:#696257;

  font-size:7px;
}

.tx-amount{
  font-size:10px;
  font-weight:800;
}

.plus{
  color:var(--green);
}

.minus{
  color:var(--red);
}


/* =========================================================
   EARN
   ========================================================= */

.big-card{
  padding:22px;
}

.big-label{
  color:#746d61;

  font-size:8px;
  letter-spacing:1.4px;
}

.big-number{
  margin-top:8px;

  color:var(--gold-light);

  font-size:34px;
  font-weight:900;
}

.stream-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.stream{
  padding:17px;

  border-radius:18px;

  border:1px solid var(--border);

  background:
    rgba(255,255,255,.018);
}

.stream-icon{
  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  color:var(--gold);

  border:1px solid var(--border);
}

.stream-name{
  margin-top:11px;

  font-size:10px;
  font-weight:750;
}

.stream-value{
  margin-top:6px;

  color:var(--gold-light);

  font-size:16px;
  font-weight:850;
}


/* =========================================================
   FRIENDS
   ========================================================= */

.referral{
  padding:21px;
}

.ref-icon{
  width:48px;
  height:48px;

  border-radius:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--gold);

  border:1px solid var(--border);
}

.ref-title{
  margin-top:15px;

  font-size:20px;
  font-weight:850;
}

.ref-description{
  margin-top:6px;

  color:#81796d;

  font-size:9px;

  line-height:1.55;
}

.ref-link{
  display:flex;

  gap:7px;

  margin-top:17px;
}

.ref-link input{
  min-width:0;
  flex:1;

  height:41px;

  padding:0 10px;

  color:#aaa18f;

  background:#0b0a08;

  border:1px solid var(--border);

  border-radius:11px;

  font-size:8px;
}

.copy{
  width:67px;

  border-radius:11px;

  background:var(--gold);

  color:#171209;

  font-size:8px;
  font-weight:850;
}

.ref-stats{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:7px;

  margin-top:14px;
}

.ref-stat{
  padding:12px 5px;

  text-align:center;

  border-radius:13px;

  border:1px solid var(--border);

  background:rgba(255,255,255,.018);
}

.ref-number{
  color:var(--gold-light);

  font-size:16px;
  font-weight:850;
}

.ref-label{
  margin-top:4px;

  color:#696257;

  font-size:7px;
}


/* =========================================================
   STATS
   ========================================================= */

.stats-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.stat{
  padding:18px;

  border-radius:19px;

  border:1px solid var(--border);

  background:rgba(255,255,255,.018);
}

.stat-label{
  color:#70695d;

  font-size:8px;
  letter-spacing:1px;
}

.stat-number{
  margin-top:7px;

  color:var(--gold-light);

  font-size:20px;
  font-weight:850;
}

.stat-small{
  margin-top:5px;

  color:var(--green);

  font-size:7px;
}


/* =========================================================
   NFT
   ========================================================= */

.nft-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;
}

.nft{
  padding:9px;

  border-radius:19px;

  border:1px solid var(--border);

  background:rgba(255,255,255,.018);
}

.nft img{
  width:100%;

  aspect-ratio:1;

  object-fit:cover;

  border-radius:14px;

  border:1px solid var(--border);
}

.nft-name{
  margin:9px 3px 3px;

  font-size:9px;
  font-weight:750;
}

.nft-status{
  margin:0 3px 4px;

  color:var(--gold-dark);

  font-size:7px;
  letter-spacing:1px;
}


/* =========================================================
   PROFILE
   ========================================================= */

.profile{
  padding:23px;

  text-align:center;
}

.profile-avatar{
  width:78px;
  height:78px;

  object-fit:cover;

  border-radius:24px;

  border:1px solid var(--border-strong);

  box-shadow:
    0 0 28px rgba(239,209,138,.09);
}

.profile-name{
  margin-top:12px;

  font-size:19px;
  font-weight:850;
}

.profile-user{
  margin-top:5px;

  color:#70695d;

  font-size:9px;
}

.badges{
  display:flex;

  justify-content:center;

  gap:6px;

  margin-top:12px;
}

.badge{
  padding:7px 9px;

  border-radius:20px;

  border:1px solid var(--border);

  color:#918878;

  font-size:7px;
  letter-spacing:.5px;
}

.badge.active{
  color:var(--green);

  border-color:rgba(131,214,161,.22);
}

.settings{
  padding:5px 17px;
}

.setting{
  display:flex;

  align-items:center;

  gap:11px;

  padding:14px 0;

  border-bottom:1px solid rgba(255,255,255,.045);
}

.setting:last-child{
  border-bottom:0;
}

.setting-icon{
  width:36px;
  height:36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  color:var(--gold);

  border:1px solid var(--border);
}

.setting-text{
  flex:1;
}

.setting-name{
  font-size:10px;
  font-weight:750;
}

.setting-sub{
  margin-top:3px;

  color:#676055;

  font-size:7px;
}

.setting-state{
  color:var(--green);

  font-size:7px;
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav{

  position:fixed;

  z-index:100;

  left:0;
  right:0;
  bottom:0;

  height:
    calc(75px + env(safe-area-inset-bottom));

  padding:
    5px 10px
    calc(5px + env(safe-area-inset-bottom));

  background:
    rgba(9,9,8,.98);

  border-top:1px solid rgba(239,209,138,.12);
}

.nav{
  width:100%;
  height:65px;

  display:grid;

  grid-template-columns:
    1fr
    1fr
    1.15fr
    1fr
    1fr;

  align-items:center;
}

.nav-item{
  height:60px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:4px;

  color:#686157;

  background:transparent;
}

.nav-item.active{
  color:var(--gold);
}

.nav-item span{
  font-size:7px;
  letter-spacing:.7px;
  font-weight:700;
}

.nav-icon{
  width:20px;
  height:20px;

  position:relative;
}


/* CSS LINE ICONS */

.home-icon:before{
  content:"⌂";

  font-size:23px;
  line-height:18px;
}

.earn-icon:before{
  content:"↗";

  font-size:24px;
  line-height:18px;
}
