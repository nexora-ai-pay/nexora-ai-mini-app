<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Nexora AI</title>

<style>
:root{
    --bg:#070706;
    --bg2:#0d0c09;
    --card:#11100d;
    --card2:#16140f;

    --gold:#f1d48b;
    --gold2:#ffe7a6;
    --gold3:#c9a85d;

    --text:#fff8e8;
    --muted:#a9a08d;

    --border:rgba(241,212,139,.18);
    --glow:rgba(241,212,139,.22);

    --green:#b9e8bd;
    --red:#f0a5a5;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
    background:
        radial-gradient(circle at 50% -10%,#292114 0,#0b0a08 32%,#070706 72%);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    padding:14px 14px 105px;
    position:relative;
}

.app::before{
    content:"";
    position:fixed;
    inset:20% -20% auto;
    height:450px;
    background:url("logo.png") center/300px no-repeat;
    opacity:.025;
    filter:drop-shadow(0 0 45px var(--gold));
    pointer-events:none;
    z-index:0;
}

/* =========================
HEADER
========================= */

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:17px;
    position:relative;
    z-index:2;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:54px;
    height:54px;
    border-radius:16px;
    object-fit:contain;
    border:1px solid var(--border);
    background:#0c0b09;
    box-shadow:0 0 24px var(--glow);
}

.brand-name{
    font-size:15px;
    font-weight:800;
    letter-spacing:1.7px;
}

.brand-sub{
    font-size:9px;
    color:var(--gold3);
    letter-spacing:1.15px;
    margin-top:3px;
}

.head-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:39px;
    height:39px;
    border:1px solid var(--border);
    border-radius:13px;
    background:rgba(255,255,255,.025);
    display:grid;
    place-items:center;
    color:var(--gold2);
    box-shadow:0 8px 22px rgba(0,0,0,.18);
}

.icon-btn svg{
    width:18px;
    height:18px;
}

/* =========================
PAGES
========================= */

.page{
    display:none;
    position:relative;
    z-index:1;
    animation:pageIn .28s ease;
}

.page.active{
    display:block;
}

@keyframes pageIn{
    from{
        opacity:0;
        transform:translateY(7px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

/* =========================
HERO
========================= */

.hero{
    border:1px solid var(--border);
    border-radius:26px;
    padding:20px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.012)
        );
    box-shadow:
        0 18px 50px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.04);
    position:relative;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-70px;
    top:-70px;
    border-radius:50%;
    background:var(--glow);
    filter:blur(38px);
}

.eyebrow{
    font-size:10px;
    color:var(--gold3);
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.balance{
    font-size:31px;
    font-weight:800;
    letter-spacing:-.7px;
    margin-top:7px;
    position:relative;
    z-index:1;
}

.balance span{
    font-size:14px;
    color:var(--gold);
    font-weight:700;
}

.change{
    font-size:11px;
    color:var(--green);
    margin-top:5px;
}

.mini-row{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    position:relative;
    z-index:1;
}

.mini-label{
    font-size:10px;
    color:var(--muted);
}

.mini-value{
    font-size:13px;
    font-weight:700;
    margin-top:4px;
}

/* =========================
BUTTONS
========================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:12px 0;
}

.btn{
    border:1px solid var(--border);
    border-radius:15px;
    padding:13px;
    background:
        linear-gradient(
            135deg,
            rgba(241,212,139,.17),
            rgba(241,212,139,.045)
        );
    color:var(--gold2);
    font-weight:800;
    box-shadow:0 10px 24px rgba(0,0,0,.2);
}

.btn.secondary{
    background:rgba(255,255,255,.025);
    color:var(--text);
}

/* =========================
SECTION
========================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 2px 10px;
}

.section-title h2{
    font-size:14px;
    margin:0;
    letter-spacing:.3px;
}

.section-title small{
    font-size:10px;
    color:var(--muted);
}

/* =========================
CARD
========================= */

.card{
    border:1px solid var(--border);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );
    border-radius:20px;
    padding:15px;
    box-shadow:0 14px 35px rgba(0,0,0,.22);
}

/* =========================
LIVE MINING
========================= */

.live-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.live{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    color:#d9f0db;
    letter-spacing:1px;
}

.dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#b9e8bd;
    box-shadow:0 0 10px #b9e8bd;
    animation:pulse 1.2s infinite;
}

@keyframes pulse{
    50%{
        opacity:.35;
        transform:scale(.7);
    }
}

/* STEP 1 */

.mining-number{
    font-size:27px;
    font-weight:800;
    margin:9px 0 2px;
    color:var(--gold2);
    text-shadow:
        0 0 10px rgba(241,212,139,.18),
        0 0 24px rgba(241,212,139,.08);
    transition:
        transform .18s ease,
        text-shadow .18s ease;
    letter-spacing:.2px;
}

.mining-number.bump{
    transform:scale(1.035);
    text-shadow:
        0 0 12px rgba(241,212,139,.32),
        0 0 30px rgba(241,212,139,.14);
}

.rate{
    font-size:10px;
    color:var(--muted);
}

.progress{
    height:6px;
    background:#252119;
    border-radius:20px;
    overflow:hidden;
    margin:13px 0;
}

.progress span{
    display:block;
    height:100%;
    width:67%;
    background:
        linear-gradient(
            90deg,
            var(--gold3),
            var(--gold2)
        );
    border-radius:20px;
    box-shadow:0 0 14px var(--gold);
}

.claim{
    width:100%;
    padding:11px;
    border-radius:13px;
    border:1px solid var(--border);
    background:rgba(241,212,139,.08);
    color:var(--gold2);
    font-weight:800;
}

/* =========================
QUICK ACCESS
========================= */

.quick{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.quick-item{
    border:1px solid var(--border);
    border-radius:17px;
    padding:13px 7px;
    background:rgba(255,255,255,.025);
    text-align:center;
    color:var(--text);
}

.qicon{
    width:34px;
    height:34px;
    margin:0 auto 7px;
    border-radius:11px;
    display:grid;
    place-items:center;
    background:rgba(241,212,139,.07);
    color:var(--gold2);
}

.qicon svg{
    width:18px;
    height:18px;
}

.quick-item b{
    font-size:10px;
    display:block;
}

.quick-item span{
    font-size:8px;
    color:var(--muted);
    display:block;
    margin-top:3px;
}

/* =========================
FORMS
========================= */

.form-grid{
    display:grid;
    gap:10px;
}

.field label{
    display:block;
    font-size:10px;
    color:var(--muted);
    margin:0 0 6px;
}

.input{
    width:100%;
    border:1px solid var(--border);
    border-radius:13px;
    background:#0b0a08;
    color:var(--text);
    padding:12px;
    outline:none;
}

.input:focus{
    border-color:rgba(241,212,139,.5);
    box-shadow:0 0 0 3px rgba(241,212,139,.05);
}

/* =========================
CALCULATOR
========================= */

.calc-results{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:11px;
}

.result{
    padding:13px;
    border-radius:15px;
    background:rgba(241,212,139,.055);
    border:1px solid var(--border);
}

.result small{
    color:var(--muted);
    font-size:9px;
}

.result strong{
    display:block;
    font-size:16px;
    color:var(--gold2);
    margin-top:4px;
}

.note{
    font-size:9px;
    color:var(--muted);
    line-height:1.5;
    margin-top:10px;
}

/* =========================
STATS
========================= */

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.stat{
    padding:14px;
    border:1px solid var(--border);
    border-radius:16px;
    background:rgba(255,255,255,.025);
}

.stat small{
    font-size:9px;
    color:var(--muted);
}

.stat strong{
    display:block;
    margin-top:5px;
    font-size:17px;
}

/* =========================
STEP 3 CHART
========================= */

.chart-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:5px;
}

.chart-title{
    font-size:12px;
    font-weight:800;
}

.periods{
    display:flex;
    gap:5px;
}

.period{
    border:1px solid var(--border);
    background:transparent;
    color:var(--muted);
    font-size:9px;
    padding:7px 9px;
    border-radius:9px;
}

.period.active{
    background:rgba(241,212,139,.12);
    color:var(--gold2);
}

.chart-summary{
    font-size:22px;
    font-weight:800;
    color:var(--gold2);
    margin-top:8px;
}

.chart-summary small{
    color:var(--green);
    font-size:9px;
    font-weight:600;
}

.chart{
    height:175px;
    display:flex;
    align-items:end;
    gap:7px;
    padding:16px 7px 22px;
    position:relative;
}

.bar{
    flex:1;
    min-width:7px;
    height:var(--h);
    background:
        linear-gradient(
            180deg,
            var(--gold2),
            var(--gold3)
        );
    border-radius:8px 8px 3px 3px;
    box-shadow:
        0 0 13px
        rgba(241,212,139,.13);

    position:relative;

    transform-origin:bottom;
    animation:barIn .7s ease both;
}

@keyframes barIn{
    from{
        transform:scaleY(0);
    }

    to{
        transform:scaleY(1);
    }
}

.bar span{
    position:absolute;
    bottom:-18px;
    left:50%;
    transform:translateX(-50%);
    font-size:8px;
    color:var(--muted);
}

/* =========================
TRANSACTIONS
========================= */

.tx{
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.055);
}

.tx:last-child{
    border-bottom:0;
}

.tx-icon{
    width:36px;
    height:36px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:rgba(241,212,139,.07);
    color:var(--gold2);
}

.tx-icon svg{
    width:17px;
}

.tx-main{
    flex:1;
}

.tx-main b{
    font-size:11px;
}

.tx-main small{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-top:3px;
}

.tx-amt{
    text-align:right;
    font-size:11px;
    font-weight:800;
}

.positive{
    color:var(--green);
}

.negative{
    color:var(--red);
}

/* =========================
NFT
========================= */

.nft-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.nft{
    border:1px solid var(--border);
    border-radius:19px;
    padding:10px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );
    overflow:hidden;
}

.nft img{
    width:100%;
    aspect-ratio:1;
    border-radius:14px;
    object-fit:cover;
    background:#0b0a08;
}

.nft b{
    font-size:10px;
    display:block;
    margin-top:8px;
}

.nft small{
    font-size:8px;
    color:var(--gold3);
}

/* =========================
REFERRAL
========================= */

.ref-code{
    display:flex;
    gap:8px;
}

.ref-code input{
    flex:1;
}

.copy{
    width:78px;
}

/* =========================
PROFILE
========================= */

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:58px;
    height:58px;
    border-radius:18px;
    border:1px solid var(--border);
    padding:6px;
    background:#0c0b09;
}

.profile b{
    font-size:14px;
}

.profile small{
    display:block;
    color:var(--muted);
    font-size:9px;
    margin-top:4px;
}

.status-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 0;
    border-bottom:1px solid rgba(255,255,255,.055);
}

.status-row:last-child{
    border-bottom:0;
}

.status-left{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:11px;
}

.status-left svg{
    width:17px;
    color:var(--gold2);
}

.status-pill{
    font-size:8px;
    padding:5px 8px;
    border-radius:9px;
    border:1px solid rgba(185,232,189,.22);
    color:var(--green);
    background:rgba(185,232,189,.05);
}

/* =========================
BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    left:50%;
    bottom:10px;
    transform:translateX(-50%);

    width:min(
        492px,
        calc(100% - 22px)
    );

    height:67px;

    border:1px solid var(--border);
    border-radius:23px;

    background:rgba(12,11,9,.91);

    backdrop-filter:blur(18px);

    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr 1fr;

    align-items:center;

    box-shadow:
        0 18px 40px
        rgba(0,0,0,.45);

    z-index:10;
}

.nav-item{
    border:0;
    background:none;
    color:#857d6e;

    font-size:8px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:4px;
}

.nav-item svg{
    width:19px;
    height:19px;
}

.nav-item.active{
    color:var(--gold2);
}

.center-logo{
    width:48px;
    height:48px;
    border-radius:17px;

    padding:6px;

    background:
        linear-gradient(
            145deg,
            #1c170d,
            #0d0c09
        );

    border:1px solid rgba(241,212,139,.38);

    box-shadow:
        0 0 25px
        rgba(241,212,139,.25);

    object-fit:contain;
}

/* =========================
TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(15px);

    background:#15130f;

    border:1px solid var(--border);

    color:var(--gold2);

    padding:11px 15px;

    border-radius:13px;

    font-size:10px;

    opacity:0;
    pointer-events:none;

    transition:.25s ease;

    z-index:50;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.4);
}

.toast.show{
    opacity:1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:360px){

    .balance{
        font-size:27px;
    }

    .quick{
        gap:5px;
    }

    .quick-item{
        padding:11px 5px;
    }

    .brand-name{
        font-size:14px;
    }

    .chart{
        gap:4px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================
HEADER
========================= -->

<header>

    <div class="brand">

        <img
            src="logo.png"
            class="brand-logo"
            alt="Nexora AI"
        >

        <div>

            <div class="brand-name">
                NEXORA AI
            </div>

            <div class="brand-sub">
                AI AUTO PAY ECOSYSTEM
            </div>

        </div>

    </div>

    <div class="head-actions">

        <button
            class="icon-btn"
            onclick="toast('Notifications are currently in demo mode')"
        >

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="1.7">

                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                <path d="M10 21h4"/>

            </svg>

        </button>

        <button
            class="icon-btn"
            onclick="openPage('profile')"
        >

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor"
                 stroke-width="1.7">

                <circle cx="12" cy="8" r="3.5"/>
                <path d="M5 20c.8-3.5 3.2-5.3 7-5.3s6.2 1.8 7 5.3"/>

            </svg>

        </button>

    </div>

</header>


<!-- =====================================================
HOME
===================================================== -->

<section
    class="page active"
    id="home"
>

    <div class="hero">

        <div class="eyebrow">
            TOTAL PORTFOLIO
        </div>

        <div class="balance">
            $1,250.00
            <span>USDT</span>
        </div>

        <div class="change">
            +12.48% this month
        </div>

        <div class="mini-row">

            <div>
                <div class="mini-label">
                    Available Balance
                </div>

                <div class="mini-value">
                    $840.00
                </div>
            </div>

            <div style="text-align:right">

                <div class="mini-label">
                    Auto Pay
                </div>

                <div class="mini-value">
                    Active
                </div>

            </div>

        </div>

    </div>


    <div class="actions">

        <button
            class="btn"
            onclick="openPage('deposit')"
        >
            Deposit
        </button>

        <button
            class="btn secondary"
            onclick="openPage('withdraw')"
        >
            Withdraw
        </button>

    </div>


    <!-- LIVE MINING -->

    <div class="section-title">

        <h2>
            Live Mining Income
        </h2>

        <small>
            Real-time UI
        </small>

    </div>

    <div class="card">

        <div class="live-head">

            <div class="live">

                <span class="dot"></span>

                LIVE

            </div>

            <small class="rate">
                Dynamic earning
            </small>

        </div>


        <!-- STEP 1 LIVE NUMBER -->

        <div
            class="mining-number"
            id="miningAmount"
        >
            +0.000024 USDT
        </div>

        <div class="rate">
            Estimated live earning animation
        </div>


        <div class="progress">
            <span></span>
        </div>


        <button
            class="claim"
            onclick="claim()"
        >
            Claim Earnings
        </button>

    </div>


    <!-- QUICK ACCESS -->

    <div class="section-title">

        <h2>
            Quick Access
        </h2>

        <small>
            Explore
        </small>

    </div>

    <div class="quick">

        <button
            class="quick-item"
            onclick="openPage('earn')"
        >

            <div class="qicon">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="1.7">

                    <path d="M12 3v18"/>
                    <path d="M17 7.5c0-2-2-3.5-5-3.5S7 5.5 7 7.5 9 11 12 11s5 1.5 5 3.5-2 3.5-5 3.5-5-1.5-5-3.5"/>

                </svg>

            </div>

            <b>Earn</b>
            <span>USDT</span>

        </button>


        <button
            class="quick-item"
            onclick="openPage('nft')"
        >

            <div class="qicon">

                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor"
                     stroke-width="1.7">

                    <rect x="4" y="4" width="16" height="16" rx="3"/>
                    <path d="m7 16 3.2-4 2.5 3 1.8-2.2L17 16"/>
                    <circle cx="9" cy="9" r="1"/>

                </svg>

            </div>

            <b>NFT</b>
            <span
