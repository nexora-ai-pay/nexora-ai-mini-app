const LOGO='logo.png';
let currentUser=null,balance=0,withdrawalSubmitting=false;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#00130c');tg.setBackgroundColor('#00130c')}catch(e){}}
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=String(v??'')}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initData(){return tg?.initData||''}
async function apiFetch(path,opt={}){const d=initData();if(!d)throw new Error('Please open Nexora AI from Telegram.');const headers={'Content-Type':'application/json','X-Telegram-Init-Data':d,...(opt.headers||{})};const r=await fetch(API_BASE+path,{...opt,headers});let x={};try{x=await r.json()}catch(e){}if(!r.ok||x.success===false)throw new Error(x.message||`Request failed (${r.status})`);return x}
function telegramName(){const u=tg?.initDataUnsafe?.user;if(!u)return'Telegram User';return[u.first_name,u.last_name].filter(Boolean).join(' ').trim()||(u.username?'@'+u.username:'Telegram User')}
function applyUser(u){if(!u)return;currentUser=u;balance=Number(u.balance||0);setText('userName',[u.first_name,u.last_name].filter(Boolean).join(' ').trim()||(u.username?'@'+u.username:'Telegram User'));setText('balance',balance.toFixed(4));setText('usd',balance.toFixed(2));setText('todayStatus','↑ Backend Balance')}
async function syncUser(){try{const referral_code=new URLSearchParams(location.search).get('startapp')||'';const d=await apiFetch('/api/users',{method:'POST',body:JSON.stringify({referral_code})});applyUser(d.user)}catch(e){console.error(e);showToast(e.message)}}
function openModal(title,text,body,cls=''){setText('modalTitle',title);setText('modalText',text||'');const b=document.getElementById('modalBody');if(b)b.innerHTML=body||'';const s=document.getElementById('sheet');if(s)s.className='sheet '+cls;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function showToast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
function goHome(){closeModal();window.scrollTo({top:0,behavior:'smooth'})}
function openEarning(){openModal('Earning USDT','Current backend balance',`<div class="notice">Available backend balance: <b style="color:#70ffa9">${balance.toFixed(4)} USDT</b><br><br>The automatic earning-credit engine is not enabled in the current backend, so the UI does not fabricate earnings.</div>`)}
function openClaim(){openModal('Claim Rewards','Secure claim status',`<div class="notice">Claim UI is ready. No balance is increased until a verified backend claim endpoint is enabled.</div>`)}
function openMining(){openModal('Live Mining','AI Mining Engine',`<div class="mine"><div class="mineRow"><div class="bolt">ϟ</div><div style="flex:1"><div class="mineName">AI Mining Engine</div><div class="mineSub">Live interface • backend earning engine pending</div></div><span class="live">● LIVE</span></div></div>`)}
async function openDeposit(){openModal('Deposit','Deposit history',`<div id="depositBody" class="notice">Loading...</div>`);try{const d=await apiFetch('/api/deposits');const e=document.getElementById('depositBody');if(e)e.innerHTML=(d.deposits||[]).length?(d.deposits||[]).slice(0,10).map(x=>`<div style="padding:8px 0;border-bottom:1px solid #0b4d31"><b>${Number(x.amount||0).toFixed(4)} USDT</b> · <span style="color:#70ffa9">${esc(x.status||'pending')}</span><br><small>${esc(x.created_at||'')}</small></div>`).join(''):'No deposit records yet.'}catch(e){setText('depositBody',e.message)}}
async function openReferral(){openModal('Referral Program','5% commission applies only to successful NFT purchases by valid referrals.',`<div class="notice">Loading referral data...</div>`);try{const d=await apiFetch('/api/referral');openModal('Referral Program','5% commission applies only to successful NFT purchases by valid referrals.',`<div class="notice"><b>Referral Code</b><div class="field">${esc(d.referral_code||'')}</div><b>Referrals:</b> ${Number(d.referral_count||0)}<br><b>NFT Commission:</b> <span style="color:#70ffa9">${Number(d.total_commission||0).toFixed(4)} USDT</span></div><button class="primary" style="margin-top:10px" onclick="copyText('${esc(d.referral_code||'')}')">Copy Referral Code</button>`)}catch(e){openModal('Referral Program','Could not load referral data',`<div class="notice">${esc(e.message)}</div>`)}}
function copyText(v){navigator.clipboard?.writeText(v);showToast('Referral code copied')}
function openWithdrawal(){openModal('Withdrawal','Submit a withdrawal request.',`<label>Amount (USDT)</label><input id="wdAmount" class="field" type="number" min="0" step="0.0001" placeholder="Enter amount"><label>Wallet address</label><input id="wdAddress" class="field" type="text" placeholder="Enter wallet address"><button class="primary" onclick="submitWithdrawal()">Submit Withdrawal</button><div id="wdStatus" class="notice" style="margin-top:10px">Available balance: ${balance.toFixed(4)} USDT</div>`)}
async function submitWithdrawal(){const a=Number(document.getElementById('wdAmount')?.value||0),addr=String(document.getElementById('wdAddress')?.value||'').trim(),s=document.getElementById('wdStatus');if(!a||a<=0){if(s)s.textContent='Enter a valid amount.';return}if(addr.length<10){if(s)s.textContent='Enter a valid wallet address.';return}if(withdrawalSubmitting)return;withdrawalSubmitting=true;if(s)s.textContent='Submitting...';try{const d=await apiFetch('/api/withdrawals',{method:'POST',body:JSON.stringify({amount:a,address:addr})});if(d.user)applyUser(d.user);if(s)s.textContent='Withdrawal request submitted.';showToast('Withdrawal submitted')}catch(e){if(s)s.textContent=e.message||'Withdrawal failed'}finally{withdrawalSubmitting=false}}

function openSupport(){const url='https://t.me/NexoraAI_Pay_bot';if(tg?.openTelegramLink)tg.openTelegramLink(url);else window.open(url,'_blank')}
function openCalculator(){openModal('Income Calculator','Calculate any amount with your chosen rates.',`<label>Capital / Amount (USDT)</label><input id="calcAmount" class="field" type="number" min="0" step="0.0001" value="${balance.toFixed(4)}"><label>Daily %</label><input id="calcDaily" class="field" type="number" min="0" step="0.01" value="0.06"><label>Monthly %</label><input id="calcMonthly" class="field" type="number" min="0" step="0.01" value="1.80"><div id="calcResult" class="notice">Press Calculate to view Daily %, Monthly %, Daily Income, Monthly Income and Total Income.</div><button class="primary" style="margin-top:10px" onclick="calculateIncome()">Calculate</button>`)}
function calculateIncome(){const a=Math.max(0,Number(document.getElementById('calcAmount')?.value||0)),d=Math.max(0,Number(document.getElementById('calcDaily')?.value||0)),m=Math.max(0,Number(document.getElementById('calcMonthly')?.value||0));const di=a*d/100,mi=a*m/100,t=mi;const r=document.getElementById('calcResult');if(r)r.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><div>Daily %<b style="display:block;color:#70ffa9">${d.toFixed(2)}%</b></div><div>Monthly %<b style="display:block;color:#70ffa9">${m.toFixed(2)}%</b></div><div>Daily Income<b style="display:block;color:#70ffa9">${di.toFixed(4)} USDT</b></div><div>Monthly Income<b style="display:block;color:#70ffa9">${mi.toFixed(4)} USDT</b></div><div style="grid-column:1/-1">Total Income<b style="display:block;color:#70ffa9;font-size:18px">${t.toFixed(4)} USDT</b></div></div>`}
function openNFT(){const filters=['All','Common','Rare','Epic','Legendary','Mythic'];const fs=filters.map((x,i)=>`<button class="filter ${i===0?'active':''}" data-filter="${x}" onclick="filterNFT('${x}',this)">${x}</button>`).join('');openModal('NFT Collection','Own • Earn • Grow — choose a Nexora AI NFT plan using your available backend USDT balance.',`<div class="nftScroll"><div class="nftHero"><img src="${LOGO}" alt=""><div><h3>Nexora NFT Collection</h3><p>9 premium tiers • fixed plan details • backend purchase</p></div><div class="tiers"><b>9</b>Tiers</div></div><div class="filters">${fs}</div><div id="nftGrid" class="nftGrid">${NFT_CARDS}</div><div class="myPurchases" onclick="loadNFTPurchases()">▣ &nbsp; My NFT Purchases <span>›</span></div><div id="purchaseList" class="purchaseList"></div></div>`,'nftModal')}
function filterNFT(r,b){document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.nftCard').forEach(c=>c.classList.toggle('hidden',r!=='All'&&!c.classList.contains('rarity-'+r.toLowerCase())))}
async function buyNFT(id){const p=NFT_PLANS.find(x=>x.id===id);if(!p)return;if(balance<p.price){showToast(`Insufficient balance for ${p.name}`);return}if(!confirm(`Buy ${p.name} NFT for ${p.price.toFixed(2)} USDT?`))return;try{const d=await apiFetch('/api/nft/purchase',{method:'POST',body:JSON.stringify({nft_id:id,client_request_id:'NFT-'+Date.now()+'-'+Math.random().toString(36).slice(2)})});if(d.user)applyUser(d.user);showToast(`${p.name} purchased successfully`);loadNFTPurchases()}catch(e){showToast(e.message||'NFT purchase failed')}}
async function loadNFTPurchases(){const e=document.getElementById('purchaseList');if(!e)return;e.innerHTML='<div class="notice">Loading purchases...</div>';try{const d=await apiFetch('/api/nft/purchases');const rows=d.purchases||[];e.innerHTML=rows.length?rows.map(p=>`<div class="notice" style="margin-bottom:6px"><b>${esc(p.nft_name||p.name||'NFT')}</b> · ${Number(p.price||0).toFixed(2)} USDT<br><small>${esc(p.created_at||'')}</small></div>`).join(''):'<div class="notice">No NFT purchases yet.</div>'}catch(e){e.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function navClick(el,n){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(n==='Home'||n==='Nexora')return goHome();if(n==='Friend')openReferral();if(n==='NFT')openNFT();if(n==='Profile')openProfile();tg?.HapticFeedback?.selectionChanged()}
setText('userName',telegramName());syncUser();setInterval(syncUser,30000);
</script>
</div>
