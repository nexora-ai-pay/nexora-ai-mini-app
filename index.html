<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#00140d">
<title>NEXORA AI — AI AUTO PAY ECOSYSTEM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#00100a;
  --panel:rgba(0,20,13,.78);
  --panel2:rgba(0,28,18,.82);
  --green:#48ff9a;
  --green2:#aaffd0;
  --darkgreen:#063b26;
  --line:#08b867;
  --gold:#f0d85c;
  --white:#f7fff9;
  --muted:#b7c9c1;
  --shadow:0 0 28px rgba(39,255,137,.11),inset 0 0 24px rgba(0,255,140,.025);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  min-height:100%;
  background:#000;
  color:var(--white);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}

body{
  overflow-x:hidden
}

button{
  font:inherit;
  color:inherit
}

.app{
  position:relative;
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 83% 22%,rgba(28,139,75,.23),transparent 28%),
    radial-gradient(circle at 17% 63%,rgba(0,95,53,.24),transparent 34%),
    linear-gradient(180deg,#000b07 0%,#00130c 48%,#000805 100%);
}

.app:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background:
    linear-gradient(115deg,transparent 0 45%,rgba(38,255,146,.18) 45.2%,transparent 45.5%),
    radial-gradient(circle at 70% 40%,rgba(160,255,209,.16),transparent 22%);
}

.watermark{
  position:fixed;
  right:-145px;
  top:100px;
  width:500px;
  height:500px;
  border-radius:50%;
  border:1px solid rgba(71,255,163,.13);
  transform:rotate(-9deg);
  pointer-events:none;
  opacity:.7;
}

.watermark:after{
  content:"N";
  position:absolute;
  right:55px;
  top:100px;
  font-size:250px;
  font-weight:900;
  color:rgba(60,255,159,.045);
  text-shadow:0 0 30px rgba(60,255,159,.12);
}

.city{
  position:fixed;
  inset:auto 0 0;
  height:46vh;
  pointer-events:none;
  opacity:.16;
  background:
   linear-gradient(180deg,transparent 0%,rgba(0,40,25,.5) 25%,rgba(0,10,6,.95) 100%),
   repeating-linear-gradient(90deg,transparent 0 28px,rgba(40,255,150,.06) 29px 31px,transparent 32px 67px);
  clip-path:polygon(
    0 48%,5% 41%,9% 49%,13% 34%,18% 46%,23% 30%,
    29% 43%,35% 28%,42% 45%,49% 34%,55% 44%,62% 25%,
    68% 43%,74% 31%,81% 44%,87% 29%,93% 42%,100% 34%,
    100% 100%,0 100%
  );
}

.wrap{
  width:min(94vw,760px);
  margin:auto;
  padding:17px 0 132px;
  position:relative;
  z-index:2
}

.logo{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:0 2px 13px;
}

.logoMark{
  width:104px;
  height:104px;
  border-radius:50%;
  position:relative;
  flex:0 0 104px;
  background:
    radial-gradient(circle at 50% 50%,#082d22 0 47%,#00150e 48% 67%,transparent 68%);
  border:2px solid #16c8ff;
  box-shadow:
    0 0 16px #00bfff,
    0 0 38px rgba(0,194,255,.28),
    inset 0 0 18px #0aff9a;
}

.logoMark:before{
  content:"N";
  position:absolute;
  left:25px;
  top:9px;
  font-size:69px;
  line-height:1;
  font-weight:1000;
  font-style:italic;
  color:#10bfff;
  text-shadow:5px 0 #00e68b
}

.logoMark:after{
  content:"✦";
  position:absolute;
  right:20px;
  top:15px;
  color:#ffe765;
  font-size:23px
}

.logoOrbit{
  position:absolute;
  inset:23px -4px;
  border:5px solid #ffd83d;
  border-left-color:transparent;
  border-right-color:#08c5ff;
  border-radius:50%;
  transform:rotate(-23deg)
}

.logoText h1{
  margin:0;
  font-size:clamp(31px,7vw,58px);
  letter-spacing:1px;
  line-height:.94;
  font-weight:900;
  background:linear-gradient(90deg,#fff,#dce8e5 43%,#7cffb9 100%);
  -webkit-background-clip:text;
  color:transparent
}

.logoText p{
  margin:7px 0 0;
  font-size:clamp(13px,3vw,20px);
  letter-spacing:2px;
  font-weight:700;
  color:#edf7f3
}

.card{
  background:linear-gradient(110deg,rgba(0,28,18,.86),rgba(0,18,12,.74));
  border:1.3px solid #09bb69;
  border-radius:26px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px)
}

.profile{
  min-height:105px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:16px;
  margin:0 0 21px
}

.avatar{
  width:76px;
  height:76px;
  border-radius:50%;
  display:grid;
  place-items:center;
  flex:0 0 76px;
  background:
    radial-gradient(circle,#e9fff4 0 10%,#69ff9c 11% 27%,#0a6f40 28% 55%,#002c1a 56%);
  border:3px solid #4cff8e;
  box-shadow:0 0 17px #32ff87,0 0 36px rgba(48,255,130,.35)
}

.avatar svg{
  width:49px;
  height:49px;
  fill:#eafff2
}

.profileText{
  min-width:0;
  flex:1
}

.greet{
  font-size:clamp(20px,5vw,29px);
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.verified{
  color:#baffd6;
  font-size:19px;
  margin-left:4px
}

.member{
  font-size:17px;
  color:#cad8d3;
  margin-top:4px
}

.balance{
  padding:27px 21px 24px;
  min-height:192px;
  position:relative;
  overflow:hidden;
  margin-bottom:21px
}

.balanceLeft{
  position:relative;
  z-index:2
}

.balanceTitle{
  font-size:18px;
  color:#b8c9c2;
  display:flex;
  gap:8px;
  align-items:center
}

.balanceTitle svg{
  width:25px;
  height:25px;
  stroke:#e9fff5
}

.amount{
  font-size:44px;
  line-height:1.03;
  font-weight:900;
  margin:8px 0 5px;
  letter-spacing:.3px
}

.amount span{
  color:#54ff9a;
  font-size:.64em
}

.usd{
  font-size:19px;
  color:#b8cbc3
}

.today{
  margin-top:11px;
  color:#55ff9e;
  font-size:18px;
  font-weight:700
}

.coin{
  position:absolute;
  right:28px;
  top:45px;
  width:110px;
  height:110px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle,#b9ffe0 0 5%,#35e884 6% 42%,#0b643e 43% 58%,#052d1c 59% 100%);
  border:2px solid #5effa5;
  box-shadow:0 0 18px #3cff8d,0 0 44px rgba(53,255,141,.5)
}

.coin:before{
  content:"";
  position:absolute;
  inset:-13px;
  border-radius:50%;
  border:1px dashed rgba(90,255,168,.55);
  box-shadow:0 0 25px rgba(71,255,153,.4)
}

.coin svg{
  width:59px;
  height:59px;
  fill:white;
  position:relative
}

.quickGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
  margin-bottom:21px
}

.quick{
  min-height:129px;
  padding:11px 5px 9px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer
}

.quick:active,
.feature:active,
.banner:active,
.calcBtn:active{
  transform:scale(.98)
}

.iconCircle{
  width:59px;
  height:59px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:1px solid #1d9c60;
  background:
    radial-gradient(circle,#e8fff1 0 15%,#5cff9c 16% 27%,#0b4e31 28% 64%,#031e13 65%);
  box-shadow:
    0 0 16px rgba(67,255,146,.45),
    inset 0 0 13px rgba(95,255,159,.25)
}

.iconCircle svg{
  width:35px;
  height:35px;
  stroke:#effff6;
  fill:none;
  stroke-width:2
}

.quick label{
  font-size:16px;
  font-weight:700;
  text-align:center;
  line-height:1.06
}

.twoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:19px;
  margin-bottom:19px
}

.feature{
  min-height:121px;
  padding:13px 7px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer
}

.feature .iconCircle{
  width:55px;
  height:55px
}

.feature label{
  font-size:17px;
  font-weight:700
}

.banner{
  height:119px;
  display:flex;
  align-items:center;
  overflow:hidden;
  padding:0 16px;
  cursor:pointer;
  margin-bottom:19px;
  background:linear-gradient(
    90deg,
    rgba(12,76,43,.94),
    rgba(0,31,19,.84)
  )
}

.gift{
  width:218px;
  height:100%;
  display:grid;
  place-items:center;
  font-size:74px;
  filter:drop-shadow(0 0 12px #59ff9b)
}

.bannerText{
  flex:1
}

.bannerText .small{
  font-size:18px;
  color:#d8f5e7
}

.bannerText strong{
  display:block;
  font-size:25px;
  line-height:1.1
}

.bannerText strong span{
  color:#4eff99
}

.bannerText p{
  margin:7px 0 0;
  color:#b8d6c9;
  font-size:15px
}

.arrow{
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#a9ffc7;
  color:#07351f;
  font-size:34px;
  box-shadow:0 0 18px #6effaa
}

.section{
  padding:18px 20px 15px;
  margin-bottom:19px
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:17px;
  font-size:23px;
  font-weight:800
}

.active{
  color:#5aff9f;
  font-size:15px;
  font-weight:700
}

.active:before{
  content:"•";
  font-size:24px;
  vertical-align:-2px;
  margin-right:6px
}

.mining{
  border:1px solid #057d49;
  border-radius:21px;
  padding:12px 18px;
  background:rgba(0,24,15,.8)
}

.mineRow{
  display:flex;
  align-items:center;
  gap:13px
}

.bolt{
  width:47px;
  height:47px;
  border-radius:12px;
  background:#b9ffd5;
  color:#083721;
  display:grid;
  place-items:center;
  font-size:29px;
  box-shadow:0 0 17px #4cff9b
}

.mineName{
  font-size:20px;
  font-weight:800;
  flex:1
}

.rate{
  color:#55ff9d;
  font-size:20px;
  font-weight:800;
  white-space:nowrap
}

.sub{
  font-size:14px;
  color:#b9cbc4;
  margin-top:3px
}

.progressLine{
  height:13px;
  background:#073f28;
  border-radius:20px;
  margin-top:14px;
  overflow:hidden;
  display:flex
}

.progressLine i{
  width:68%;
  display:block;
  background:linear-gradient(90deg,#39e985,#a4ffd0);
  border-radius:20px;
  box-shadow:0 0 15px #55ff9e
}

.pct{
  margin-left:auto;
  color:#d5e6df;
  font-size:15px;
  transform:translateY(-2px);
  padding-left:9px
}

.calc{
  padding:17px 18px 16px
}

.calcTop{
  display:flex;
  align-items:center;
  gap:13px
}

.calcIcon{
  width:61px;
  height:61px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:2px solid #64ff9e;
  box-shadow:0 0 20px #4aff9a;
  background:#063b26
}

.calcIcon svg{
  width:36px;
  height:36px;
  stroke:#eafff2
}

.calcTitle{
  flex:1
}

.calcTitle h3{
  margin:0;
  font-size:21px
}

.calcTitle p{
  margin:4px 0 0;
  font-size:14px;
  color:#bcd0c7
}

.calcBtn{
  border:0;
  border-radius:25px;
  background:linear-gradient(90deg,#a5ffbf,#67eb9b);
  color:#063a23;
  font-weight:800;
  padding:12px 20px;
  cursor:pointer;
  box-shadow:0 0 18px rgba(101,255,164,.25)
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  margin-top:14px;
  border:1px solid #063f29;
  border-radius:16px;
  overflow:hidden
}

.stat{
  padding:14px 7px;
  text-align:center;
  background:rgba(0,35,21,.65);
  border-right:1px solid #0a4c31
}

.stat:last-child{
  border:0
}

.stat small{
  display:block;
  color:#d7e4df;
  font-size:13px
}

.stat b{
  display:block;
  margin-top:7px;
  color:#72ffa9;
  font-size:17px
}

.stat b em{
  font-style:normal;
  font-size:11px;
  color:#c9ded5
}

.bottom{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  z-index:10;
  width:min(94vw,760px);
  height:108px;
  border-radius:28px;
  border:1.3px solid #0ecb74;
  background:rgba(0,18,12,.94);
  box-shadow:
    0 0 30px rgba(0,255,145,.1),
    inset 0 0 25px rgba(0,255,145,.03);
  backdrop-filter:blur(12px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center
}

.nav{
  height:100%;
  border:0;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  color:#91bca8;
  font-size:15px;
  cursor:pointer
}

.nav svg{
  width:31px;
  height:31px;
  stroke:currentColor;
  fill:none;
  stroke-width:2
}

.nav.active{
  color:#eafff1
}

.nav.active svg{
  filter:drop-shadow(0 0 8px #57ff9e)
}

.nav.center{
  position:relative
}

.nLogo{
  width:78px;
  height:78px;
  border-radius:50%;
  border:3px solid #ffd34c;
  background:
    radial-gradient(circle,#a7ffd0 0 10%,#29df82 11% 45%,#06482d 46%);
  display:grid;
  place-items:center;
  color:#0b633c;
  font-size:48px;
  font-weight:1000;
  box-shadow:
    0 0 25px rgba(255,214,71,.45),
    0 0 35px rgba(61,255,146,.25);
  margin-top:-34px
}

.nav.center span{
  margin-top:-2px
}

.toast{
  position:fixed;
  left:50%;
  bottom:132px;
  transform:translate(-50%,15px);
  opacity:0;
  pointer-events:none;
  background:#b9ffd1;
  color:#06341f;
  padding:11px 18px;
  border-radius:25px;
  font-weight:800;
  z-index:30;
  transition:.25s;
  white-space:nowrap;
  box-shadow:0 0 25px rgba(95,255,158,.35)
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,8,5,.78);
  backdrop-filter:blur(10px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:25;
  padding:12px
}

.modal.show{
  display:flex
}

.sheet{
  width:min(760px,100%);
  border:1px solid #18c975;
  border-radius:28px 28px 18px 18px;
  background:#001910;
  box-shadow:0 -10px 40px rgba(0,255,145,.16);
  padding:21px
}

.sheet h2{
  margin:0 0 8px;
  font-size:24px
}

.sheet p{
  color:#b8cec4
}

.close{
  float:right;
  border:0;
  background:#0a3926;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:20px;
  cursor:pointer
}

.field{
  width:100%;
  background:#001008;
  border:1px solid #0c7044;
  border-radius:14px;
  padding:14px;
  color:white;
  outline:none;
  margin:7px 0 13px
}

.primary{
  width:100%;
  border:0;
  border-radius:15px;
  padding:14px;
  background:linear-gradient(90deg,#9dffc0,#5ce99a);
  color:#063821;
  font-weight:900;
  cursor:pointer
}

.actionCard{
  border:1px solid #075f3b;
  border-radius:18px;
  padding:14px;
  background:rgba(0,30,19,.72)
}

.actionLine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.actionNote{
  font-size:14px;
  line-height:1.55
}

.fieldLabel{
  display:block;
  color:#cde4da;
  font-size:13px;
  font-weight:700;
  margin-top:4px
}

.calcResult{
  padding:8px 0 15px;
  color:#71ffa9;
  font-weight:800
}

.emptyState{
  padding:16px;
  border:1px dashed #167c4e;
  border-radius:15px;
  color:#b8cec4;
  margin:8px 0 13px
}

.profileModal{
  display:grid;
  gap:9px;
  margin:12px 0 15px
}

.profileModal>div{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:11px 12px;
  border:1px solid #075f3b;
  border-radius:13px;
  background:#00120b
}

.profileModal span{
  color:#72ffa9;
  text-align:right;
  overflow:hidden;
  text-overflow:ellipsis
}

.supportBtn,
.secondaryBtn{
  width:100%;
  border:1px solid #179c60;
  border-radius:15px;
  padding:13px;
  background:#062b1c;
  color:#dfffee;
  font-weight:800;
  cursor:pointer;
  margin-top:9px
}

.textarea{
  resize:vertical;
  min-height:120px
}

 .wrap{

 }

 }

   padding:10px 14px
 }

   height:93px;

   border-radius:23px
