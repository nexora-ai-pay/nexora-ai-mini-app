<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Nexora AI</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#050505;
  --bg2:#090806;
  --panel:#0e0d0a;
  --panel2:#14120e;
  --gold:#efd18a;
  --gold2:#ffeab0;
  --gold3:#b8934e;
  --text:#fff8e7;
  --muted:#aaa18e;
  --muted2:#777064;
  --line:rgba(239,209,138,.16);
  --line2:rgba(239,209,138,.28);
  --green:#8ed8a9;
  --red:#df8989;
  --shadow:0 18px 55px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  outline:0;
  cursor:pointer;
}

.app{
  width:100%;
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -5%,rgba(239,209,138,.10),transparent 30%),
    radial-gradient(circle at 100% 35%,rgba(239,209,138,.045),transparent 28%),
    linear-gradient(180deg,#070705 0%,#050505 55%,#030303 100%);
  padding-bottom:92px;
}

/* =========================
   TOP BRAND
========================= */

.top-brand{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:28px 20px 20px;
}

.brand-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand-logo{
  width:64px;
  height:64px;
  border-radius:20px;
  object-fit:cover;
  border:1px solid rgba(239,209,138,.35);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 0 28px rgba(239,209,138,.10);
}

.brand-title{
  font-size:25px;
  font-weight:800;
  letter-spacing:3px;
  color:var(--gold2);
  line-height:1.05;
}

.brand-subtitle{
  margin-top:8px;
  font-size:10px;
  letter-spacing:4px;
  color:#a99f8b;
  white-space:nowrap;
}

.brand-orb{
  width:54px;
  height:54px;
  border-radius:18px;
  border:1px solid var(--line2);
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.025);
  box-shadow:inset 0 0 20px rgba(239,209,138,.025);
}

.brand-orb svg{
  width:26px;
  height:26px;
  stroke:var(--gold);
  fill:none;
}

/* =========================
   PAGE SYSTEM
========================= */

.page{
  display:none;
  padding:0 16px 20px;
  animation:pageIn .28s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   COMMON
========================= */

.section{
  margin-top:18px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:0 3px 11px;
}

.section-title{
  font-size:15px;
  font-weight:750;
  letter-spacing:.4px;
}

.section-caption{
  color:var(--muted2);
  font-size:10px;
  letter-spacing:1px;
}

.card{
  position:relative;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.045),
      rgba(255,255,255,.012) 42%,
      rgba(239,209,138,.018)
    );
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.gold-text{
  color:var(--gold2);
}

.muted{
  color:var(--muted);
}

/* =========================
   BALANCE CARD
========================= */

.balance-card{
  position:relative;
  min-height:290px;
  padding:28px 24px 22px;
  overflow:hidden;
  border-radius:30px;
  border:1px solid rgba(239,209,138,.30);
  background:
    radial-gradient(
      circle at 85% 35%,
      rgba(239,209,138,.065),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
}

/* IMPORTANT:
   USDT watermark is clipped inside this card */
.balance-watermark{
  position:absolute;
  width:245px;
  height:245px;
  right:-48px;
  bottom:-58px;
  opacity:.075;
  pointer-events:none;
  z-index:0;
  filter:
    drop-shadow(0 0 20px rgba(239,209,138,.12));
}

.balance-content{
  position:relative;
  z-index:2;
}

.balance-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.balance-label{
  color:#aaa18e;
  font-size:13px;
  letter-spacing:2px;
  font-weight:600;
}

.live-pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border-radius:30px;
  border:1px solid rgba(142,216,169,.35);
  background:rgba(142,216,169,.055);
  color:var(--green);
  font-size:10px;
  letter-spacing:1.5px;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px rgba(142,216,169,.8);
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.72)}
}

.balance-number{
  margin-top:18px;
  font-size:48px;
  line-height:1;
  font-weight:850;
  letter-spacing:-2px;
  color:var(--gold2);
  text-shadow:0 0 28px rgba(239,209,138,.12);
}

.balance-currency{
  margin-top:8px;
  color:#8f8777;
  font-size:11px;
  letter-spacing:2px;
}

.balance-meta{
  display:flex;
  gap:22px;
  margin-top:24px;
}

.meta-item{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.meta-label{
  color:#777064;
  font-size:9px;
  letter-spacing:1.5px;
}

.meta-value{
  color:#e9e0cb;
  font-size:12px;
  font-weight:650;
}

.positive{
  color:var(--green)!important;
}

.balance-actions{
  display:flex;
  gap:10px;
  margin-top:23px;
}

.primary-btn,
.secondary-btn{
  flex:1;
  min-height:46px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:12px;
  font-weight:750;
  letter-spacing:.7px;
}

.primary-btn{
  color:#17120a;
  background:linear-gradient(135deg,#ffe9a7,#d4af63);
  box-shadow:0 8px 25px rgba(239,209,138,.13);
}

.secondary-btn{
  color:var(--gold2);
  border:1px solid rgba(239,209,138,.25);
  background:rgba(239,209,138,.045);
}

.primary-btn svg,
.secondary-btn svg{
  width:17px;
  height:17px;
}

/* =========================
   LIVE MINING
========================= */

.mining-card{
  padding:21px;
}

.mining-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mining-title{
  font-size:13px;
  font-weight:750;
  letter-spacing:1px;
}

.mining-status{
  color:var(--green);
  font-size:10px;
}

.mining-value{
  margin-top:13px;
  font-size:29px;
  font-weight:800;
  color:var(--gold2);
}

.mining-unit{
  font-size:11px;
  color:#8c8475;
  margin-left:4px;
}

.progress{
  height:5px;
  margin-top:16px;
  border-radius:20px;
  background:rgba(255,255,255,.06);
  overflow:hidden;
}

.progress-fill{
  width:64%;
  height:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#b8934e,#ffe9aa);
  box-shadow:0 0 15px rgba(239,209,138,.25);
}

.mining-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:17px;
}

.mining-caption{
  font-size:10px;
  color:var(--muted2);
}

.claim-btn{
  padding:11px 15px;
  border-radius:13px;
  color:#17120a;
  background:linear-gradient(135deg,#ffe9a7,#cda55a);
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
}

/* =========================
   CALCULATOR
========================= */

.calculator{
  padding:21px;
}

.calc-intro{
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
  margin-bottom:17px;
}

.field-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.field{
  min-width:0;
}

.field.full{
  grid-column:1/-1;
}

.field-label{
  display:block;
  margin:0 0 7px 3px;
  color:#918979;
  font-size:9px;
  letter-spacing:1.3px;
  text-transform:uppercase;
}

.input-wrap{
  position:relative;
}

.input-prefix{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
  color:var(--gold);
  font-size:11px;
  pointer-events:none;
}

.input-wrap input{
  width:100%;
  height:44px;
  padding:0 12px 0 32px;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  outline:none;
  background:rgba(255,255,255,.025);
}

.input-wrap input:focus{
  border-color:rgba(239,209,138,.42);
  box-shadow:0 0 0 3px rgba(239,209,138,.045);
}

.calc-results{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.result-box{
  padding:15px;
  border-radius:17px;
  border:1px solid rgba(239,209,138,.13);
  background:rgba(239,209,138,.035);
}

.result-label{
  color:#837b6c;
  font-size:9px;
  letter-spacing:1px;
}

.result-value{
  margin-top:7px;
  font-size:19px;
  font-weight:800;
  color:var(--gold2);
}

.result-unit{
  font-size:9px;
  color:#837b6c;
}

/* =========================
   QUICK ACCESS
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.quick-item{
  min-height:87px;
  padding:12px 6px;
  border-radius:18px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.022);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#d9d0bd;
}

.quick-icon{
  width:27px;
  height:27px;
  color:var(--gold);
}

.quick-item span{
  font-size:9px;
  text-align:center;
  letter-spacing:.3px;
}

/* =========================
   CHART
========================= */

.chart-card{
  padding:18px;
}

.chart-tabs{
  display:flex;
  gap:7px;
  margin-bottom:18px;
}

.chart-tab{
  padding:8px 12px;
  border-radius:10px;
  color:#827a6d;
  background:rgba(255,255,255,.025);
  font-size:9px;
  letter-spacing:.8px;
}

.chart-tab.active{
  color:#19140c;
  background:var(--gold);
}

.chart{
  position:relative;
  height:155px;
  display:flex;
  align-items:end;
  gap:7px;
  padding:10px 4px 0;
  border-bottom:1px solid rgba(239,209,138,.10);
}

.chart::before,
.chart::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  border-top:1px dashed rgba(255,255,255,.055);
}

.chart::before{top:28%}
.chart::after{top:62%}

.bar{
  position:relative;
  z-index:2;
  flex:1;
  min-width:5px;
  border-radius:8px 8px 2px 2px;
  background:linear-gradient(
    180deg,
    #ffe9a7 0%,
    #c59e55 75%,
    rgba(197,158,85,.25) 100%
  );
  box-shadow:0 0 13px rgba(239,209,138,.08);
  animation:barIn .65s ease both;
}

@keyframes barIn{
  from{
    height:0!important;
    opacity:0;
  }
  to{
    opacity:1;
  }
}

.chart-labels{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  color:#696255;
  font-size:8px;
}

/* =========================
   TRANSACTIONS
========================= */

.transaction-list{
  display:flex;
  flex-direction:column;
}

.transaction{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.045);
}

.transaction:last-child{
  border-bottom:0;
}

.tx-icon{
  width:38px;
  height:38px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  background:rgba(239,209,138,.035);
}

.tx-icon svg{
  width:18px;
  height:18px;
  color:var(--gold);
}

.tx-info{
  flex:1;
  min-width:0;
}

.tx-name{
  font-size:11px;
  font-weight:700;
}

.tx-date{
  margin-top:4px;
  color:#6f685c;
  font-size:9px;
}

.tx-amount{
  font-size:11px;
  font-weight:800;
}

.tx-amount.plus{
  color:var(--green);
}

.tx-amount.minus{
  color:var(--red);
}

/* =========================
   EARN PAGE
========================= */

.earn-summary{
  padding:22px;
}

.big-stat-label{
  color:#81796b;
  font-size:10px;
  letter-spacing:1.6px;
}

.big-stat{
  margin-top:8px;
  font-size:34px;
  font-weight:850;
  color:var(--gold2);
}

.stream-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stream{
  padding:17px;
}

.stream-icon{
  width:35px;
  height:35px;
  border-radius:12px;
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold);
}

.stream-icon svg{
  width:18px;
  height:18px;
}

.stream-title{
  margin-top:12px;
  font-size:11px;
  font-weight:700;
}

.stream-value{
  margin-top:6px;
  color:var(--gold2);
  font-size:17px;
  font-weight:800;
}

/* =========================
   FRIENDS
========================= */

.referral-card{
  padding:23px;
}

.referral-icon{
  width:54px;
  height:54px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line2);
  background:rgba(239,209,138,.04);
  color:var(--gold);
}

.referral-icon svg{
  width:27px;
  height:27px;
}

.referral-title{
  margin-top:16px;
  font-size:20px;
  font-weight:800;
}

.referral-text{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.referral-link{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.referral-link input{
  flex:1;
  min-width:0;
  height:43px;
  padding:0 11px;
  color:#bfb6a4;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.025);
  font-size:9px;
}

.copy-btn{
  width:72px;
  border-radius:12px;
  color:#18130b;
  background:var(--gold);
  font-size:10px;
  font-weight:800;
}

.referral-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:16px;
}

.ref-stat{
  text-align:center;
  padding:14px 5px;
  border-radius:14px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.018);
}

.ref-number{
  color:var(--gold2);
  font-size:17px;
  font-weight:800;
}

.ref-label{
  margin-top:4px;
  color:#6f685c;
  font-size:8px;
  letter-spacing:.6px;
}

/* =========================
   STATS
========================= */

.stats-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat-card{
  padding:19px;
}

.stat-name{
  color:#777064;
  font-size:9px;
  letter-spacing:1px;
}

.stat-value{
  margin-top:8px;
  color:var(--gold2);
  font-size:21px;
  font-weight:820;
}

.stat-change{
  margin-top:6px;
  color:var(--green);
  font-size:9px;
}

/* =========================
   NFT
========================= */

.nft-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.nft-card{
  padding:10px;
}

.nft-image{
  width:100%;
  aspect-ratio:1;
  border-radius:17px;
  object-fit:cover;
  border:1px solid var(--line);
}

.nft-name{
  margin:10px 3px 3px;
  font-size:10px;
  font-weight:750;
}

.nft-status{
  margin:0 3px 4px;
  color:var(--gold3);
  font-size:8px;
  letter-spacing:1px;
}

/* =========================
   PROFILE
========================= */

.profile-card{
  padding:24px;
  text-align:center;
}

.profile-avatar{
  width:82px;
  height:82px;
  border-radius:26px;
  object-fit:cover;
  border:1px solid rgba(239,209,138,.35);
  box-shadow:0 0 35px rgba(239,209,138,.10);
}

.profile-name{
  margin-top:13px;
  font-size:20px;
  font-weight:800;
}

.profile-handle{
  margin-top:5px;
  color:#777064;
  font-size:10px;
}

.profile-badges{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.badge{
  padding:7px 10px;
  border-radius:20px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.022);
  color:#aaa18e;
  font-size:8px;
  letter-spacing:.8px;
}

.badge.active{
  color:var(--green);
  border-color:rgba(142,216,169,.23);
}

.settings-list{
  padding:5px 18px;
}

.setting{
  display:flex;
  align-items:center;
  gap:13px;
  padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,.045);
}

.setting:last-child{
  border-bottom:0;
}

.setting-icon{
  width:38px;
  height:38px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  color:var(--gold);
}

.setting-icon svg{
  width:18px;
  height:18px;
}

.setting-info{
  flex:1;
}

.setting-title{
  font-size:11px;
  font-weight:700;
}

.setting-sub{
  margin-top:4px;
  color:#6f685c;
  font-size:9px;
}

.setting-state{
  color:var(--green);
  font-size:9px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding:
    7px 12px
    calc(7px + env(safe-area-inset-bottom))
    7px;
  background:
    linear-gradient(
      180deg,
      rgba(9,9,8,.94),
      rgba(4,4,4,.98)
    );
  border-top:1px solid rgba(239,209,138,.12);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}

.nav-inner{
  height:100%;
  max-width:560px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;
  align-items:center;
}

.nav-item{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#686258;
  background:none;
  transition:.2s ease;
}

.nav-item svg{
  width:20px;
  height:20px;
  stroke:currentColor;
}

.nav-item span{
  font-size:8px;
  letter-spacing:.7px;
  font-weight:650;
}

.nav-item.active{
  color:var(--gold);
}

.center-nav{
  display:flex;
  align-items:center;
  justify-content:center;
}

.center-logo{
  width:55px;
  height:55px;
  border-radius:18px;
  object-fit:cover;
  border:1px solid rgba(239,209,138,.42);
