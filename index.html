<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Nexora AI — Auto Pay Ecosystem</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#050505;
  --bg2:#0b0a08;
  --card:#11100d;
  --card2:#15130f;
  --gold:#efd18a;
  --gold2:#ffe9aa;
  --gold3:#b89552;
  --text:#fff9ea;
  --muted:#aaa18e;
  --border:rgba(239,209,138,.18);
  --glow:rgba(239,209,138,.22);
  --green:#83d6a1;
  --red:#df8585;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
  Inter,
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  Roboto,
  Arial,
  sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(239,209,138,.10),transparent 32%),
    radial-gradient(circle at 0% 40%,rgba(239,209,138,.035),transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:110px;
  position:relative;
}

/* =========================
   BACKGROUND WATERMARK
========================= */

.bg-watermark{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:390px;
  height:390px;
  opacity:.025;
  pointer-events:none;
  z-index:-1;
  filter:drop-shadow(0 0 45px rgba(239,209,138,.4));
}

.bg-watermark img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* =========================
   HEADER
========================= */

.header{
  padding:22px 18px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-logo{
  width:48px;
  height:48px;
  border-radius:15px;
  object-fit:cover;
  border:1px solid rgba(239,209,138,.32);
  box-shadow:
    0 0 22px rgba(239,209,138,.16),
    inset 0 0 12px rgba(255,255,255,.04);
}

.brand-title{
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--gold2);
}

.brand-subtitle{
  font-size:8px;
  letter-spacing:1.7px;
  color:#aaa18e;
  margin-top:4px;
}

.header-status{
  width:38px;
  height:38px;
  border-radius:13px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
}

/* =========================
   PAGE SYSTEM
========================= */

.page{
  display:none;
  animation:pageIn .35s ease;
}

.page.active{
  display:block;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.section{
  padding:0 16px;
}

.section-title{
  font-size:14px;
  font-weight:800;
  letter-spacing:.4px;
  margin-bottom:12px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 0 12px;
}

.section-link{
  font-size:11px;
  color:var(--gold);
}

/* =========================
   HERO BALANCE
========================= */

.balance-card{
  margin:8px 16px 0;
  padding:23px 20px 20px;
  min-height:215px;
  position:relative;
  overflow:hidden;
  border-radius:25px;
  border:1px solid rgba(239,209,138,.25);
  background:
    linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),
    linear-gradient(135deg,#16140f,#0b0a08);
  box-shadow:
    0 20px 55px rgba(0,0,0,.45),
    0 0 40px rgba(239,209,138,.055),
    inset 0 1px rgba(255,255,255,.07);
}

.balance-card:before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  right:-90px;
  top:-120px;
  background:radial-gradient(circle,rgba(239,209,138,.15),transparent 65%);
  pointer-events:none;
}

.balance-watermark{
  position:absolute;
  right:-22px;
  bottom:-45px;
  width:220px;
  height:220px;
  opacity:.075;
  object-fit:contain;
  filter:
    grayscale(1)
    sepia(1)
    drop-shadow(0 0 18px rgba(239,209,138,.35));
  pointer-events:none;
}

.balance-top{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.balance-label{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
}

.live-pill{
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid rgba(131,214,161,.20);
  color:var(--green);
  padding:5px 8px;
  border-radius:30px;
  font-size:8px;
  letter-spacing:1px;
  background:rgba(131,214,161,.045);
}

.live-dot{
  width:5px;
  height:5px;
  background:var(--green);
  border-radius:50%;
  box-shadow:0 0 8px var(--green);
  animation:pulse 1.4s infinite;
}

@keyframes pulse{
  50%{opacity:.35;transform:scale(.65)}
}

.balance-number{
  position:relative;
  z-index:2;
  margin-top:13px;
  font-size:34px;
  font-weight:900;
  letter-spacing:-1px;
  color:var(--gold2);
  text-shadow:0 0 22px rgba(239,209,138,.17);
}

.balance-unit{
  font-size:13px;
  color:var(--gold3);
  margin-left:5px;
  letter-spacing:.7px;
}

.balance-change{
  position:relative;
  z-index:2;
  display:flex;
  gap:8px;
  margin-top:6px;
  font-size:11px;
}

.positive{
  color:var(--green);
}

.balance-bottom{
  position:relative;
  z-index:2;
  margin-top:20px;
  display:flex;
  justify-content:space-between;
  align-items:end;
}

.available-label{
  font-size:9px;
  color:var(--muted);
  margin-bottom:5px;
}

.available{
  font-size:16px;
  font-weight:800;
}

.mini-status{
  text-align:right;
  font-size:9px;
  color:var(--muted);
}

.mini-status strong{
  color:var(--gold);
  display:block;
  font-size:10px;
  margin-top:4px;
}

/* =========================
   BUTTONS
========================= */

.action-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:13px 16px 0;
}

.action-btn{
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:12px;
  font-weight:800;
  letter-spacing:.4px;
}

.deposit{
  color:#0b0905;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
  box-shadow:0 8px 25px rgba(239,209,138,.13);
}

.withdraw{
  color:var(--gold2);
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
}

/* =========================
   LIVE MINING
========================= */

.mining-card{
  margin:22px 16px 0;
  padding:18px;
  border-radius:21px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
}

.mining-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mining-title{
  font-size:12px;
  font-weight:800;
}

.mining-status{
  font-size:8px;
  color:var(--green);
  letter-spacing:1px;
}

.mining-value{
  margin-top:12px;
  font-size:22px;
  font-weight:900;
  color:var(--gold2);
}

.mining-rate{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.progress{
  height:5px;
  background:rgba(255,255,255,.06);
  border-radius:20px;
  overflow:hidden;
  margin-top:15px;
}

.progress-fill{
  height:100%;
  width:67%;
  background:linear-gradient(90deg,var(--gold3),var(--gold2));
  border-radius:20px;
  box-shadow:0 0 12px rgba(239,209,138,.35);
}

.mining-footer{
  margin-top:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mining-footer span{
  color:var(--muted);
  font-size:9px;
}

.claim-btn{
  padding:9px 13px;
  border-radius:11px;
  background:rgba(239,209,138,.09);
  border:1px solid rgba(239,209,138,.18);
  color:var(--gold2);
  font-size:9px;
  font-weight:800;
}

/* =========================
   QUICK GRID
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick-card{
  padding:16px;
  min-height:110px;
  border-radius:18px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  transition:.2s;
}

.quick-card:active{
  transform:scale(.97);
}

.icon-box{
  width:37px;
  height:37px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  border:1px solid rgba(239,209,138,.17);
  background:rgba(239,209,138,.055);
  box-shadow:0 0 16px rgba(239,209,138,.055);
}

.quick-card h3{
  margin-top:12px;
  font-size:12px;
}

.quick-card p{
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
}

/* =========================
   CALCULATOR
========================= */

.calculator{
  padding:18px;
  border-radius:22px;
  border:1px solid var(--border);
  background:
    linear-gradient(145deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
}

.calc-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.calc-title{
  font-size:14px;
  font-weight:850;
}

.calc-sub{
  color:var(--muted);
  font-size:9px;
  margin-top:4px;
}

.calc-icon{
  width:40px;
  height:40px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  border:1px solid var(--border);
}

.field{
  margin-top:14px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:45px;
  border-radius:13px;
  border:1px solid rgba(239,209,138,.14);
  outline:none;
  color:var(--text);
  background:#0b0a08;
  padding:0 13px;
}

.field input:focus{
  border-color:rgba(239,209,138,.42);
  box-shadow:0 0 15px rgba(239,209,138,.07);
}

.calc-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.calc-result{
  margin-top:14px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.result-box{
  padding:13px;
  border-radius:15px;
  background:rgba(239,209,138,.045);
  border:1px solid rgba(239,209,138,.12);
}

.result-label{
  color:var(--muted);
  font-size:8px;
}

.result-value{
  margin-top:6px;
  color:var(--gold2);
  font-size:16px;
  font-weight:850;
}

.calculate-btn{
  width:100%;
  margin-top:12px;
  height:45px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
  color:#0a0804;
  font-size:11px;
  font-weight:900;
}

.calc-note{
  margin-top:10px;
  color:#797261;
  font-size:8px;
  line-height:1.5;
}

/* =========================
   CHART
========================= */

.chart-card{
  padding:18px;
  border:1px solid var(--border);
  border-radius:21px;
  background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
}

.chart-tabs{
  display:flex;
  gap:7px;
}

.chart-tab{
  padding:7px 10px;
  border-radius:9px;
  background:rgba(255,255,255,.035);
  border:1px solid transparent;
  color:var(--muted);
  font-size:8px;
}

.chart-tab.active{
  color:var(--gold2);
  border-color:rgba(239,209,138,.18);
  background:rgba(239,209,138,.07);
}

.chart{
  height:145px;
  margin-top:18px;
  display:flex;
  align-items:end;
  justify-content:space-around;
  gap:8px;
  padding:0 3px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.bar-wrap{
  height:100%;
  flex:1;
  display:flex;
  align-items:end;
  justify-content:center;
}

.bar{
  width:100%;
  max-width:28px;
  min-height:9px;
  border-radius:8px 8px 2px 2px;
  background:linear-gradient(180deg,var(--gold2),var(--gold3));
  box-shadow:0 0 16px rgba(239,209,138,.12);
  transition:height .45s ease;
}

.chart-labels{
  display:flex;
  justify-content:space-around;
  color:#756e61;
  font-size:7px;
  margin-top:7px;
}

/* =========================
   TRANSACTIONS
========================= */

.transaction{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.transaction:last-child{
  border-bottom:0;
}

.tx-icon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--gold2);
  background:rgba(239,209,138,.055);
  border:1px solid rgba(239,209,138,.12);
}

.tx-info{
  flex:1;
}

.tx-title{
  font-size:11px;
  font-weight:750;
}

.tx-time{
  color:var(--muted);
  font-size:8px;
  margin-top:3px;
}

.tx-amount{
  font-size:11px;
  font-weight:800;
  color:var(--green);
}

.tx-withdraw{
  color:var(--red);
}

/* =========================
   EARN PAGE
========================= */

.earn-hero{
  padding:20px;
  border-radius:22px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#17140e,#0b0a08);
}

.earn-big{
  font-size:29px;
  font-weight:900;
  color:var(--gold2);
  margin-top:8px;
}

.earn-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.stat-box{
  padding:15px;
  border-radius:16px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.025);
}

.stat-box span{
  color:var(--muted);
  font-size:8px;
}

.stat-box strong{
  display:block;
  margin-top:7px;
  font-size:15px;
  color:var(--gold2);
}

/* =========================
   REFERRAL
========================= */

.referral-card{
  padding:20px;
  border-radius:23px;
  border:1px solid var(--border);
  background:
    radial-gradient(circle at 100% 0,rgba(239,209,138,.10),transparent 35%),
    linear-gradient(145deg,#15130f,#0b0a08);
}

.referral-logo{
  width:55px;
  height:55px;
  border-radius:17px;
  object-fit:cover;
  border:1px solid rgba(239,209,138,.25);
  box-shadow:0 0 25px rgba(239,209,138,.12);
}

.referral-card h2{
  margin-top:16px;
  font-size:20px;
}

.referral-card p{
  color:var(--muted);
  font-size:10px;
  line-height:1.6;
  margin-top:6px;
}

.referral-box{
  margin-top:16px;
  display:flex;
  gap:7px;
}

.referral-link{
  flex:1;
  height:43px;
  padding:0 10px;
  display:flex;
  align-items:center;
  overflow:hidden;
  border-radius:12px;
  background:#090806;
  border:1px solid rgba(239,209,138,.13);
  color:#bdb39d;
  font-size:8px;
  white-space:nowrap;
}

.copy-btn{
  padding:0 14px;
  height:43px;
  border-radius:12px;
  color:#090806;
  font-size:9px;
  font-weight:900;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
}

.referral-stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:14px;
}

.ref-stat{
  text-align:center;
  padding:12px 5px;
  border-radius:13px;
  background:rgba(239,209,138,.04);
  border:1px solid rgba(239,209,138,.09);
}

.ref-stat strong{
  display:block;
  color:var(--gold2);
  font-size:14px;
}

.ref-stat span{
  color:var(--muted);
  font-size:7px;
  margin-top:4px;
  display:block;
}

/* =========================
   PROFILE
========================= */

.profile-card{
  padding:22px;
  border-radius:23px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#15130f,#0b0a08);
  text-align:center;
}

.profile-avatar{
  width:76px;
  height:76px;
  margin:auto;
  border-radius:25px;
  padding:3px;
  background:linear-gradient(135deg,var(--gold2),var(--gold3));
  box-shadow:0 0 30px rgba(239,209,138,.14);
}

.profile-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:22px;
}

.profile-name{
  margin-top:12px;
  font-size:17px;
  font-weight:850;
}

.profile-id{
  margin-top:4px;
  font-size:9px;
  color:var(--muted);
}

.profile-status{
  display:inline-flex;
  margin-top:11px;
  padding:6px 10px;
  border-radius:20px;
  color:var(--green);
  background:rgba(131,214,161,.05);
  border:1px solid rgba(131,214,161,.13);
  font-size:8px;
}

.profile-list{
  margin-top:15px;
}

.profile-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 4px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.profile-item:last-child{
  border-bottom:0;
}

.profile-item .icon-box{
  width:35px;
  height:35px;
}

.profile-item-text{
  flex:1;
  text-align:left;
}

.profile-item-text strong{
  font-size:10px;
  display:block;
}

.profile-item-text span{
  color:var(--muted);
  font-size:8px;
  display:block;
  margin-top:3px;
}

/* =========================
   NFT
========================= */

.nft-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.nft-card{
  overflow:hidden;
  border-radius:18px;
  border:1px solid var(--border);
  background:linear-gradient(145deg,#15130f,#0b0a08);
}

.nft-art{
  height:125px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:
    radial-gradient(circle,rgba(239,209,138,.18),transparent 55%),
    #0d0c09;
}

.nft-art img{
  width:75px;
  height:75px;
  object-fit:contain;
  filter:drop-shadow(0 0 20px rgba(239,209,138,.25));
}

.nft-info{
  padding:11px;
}

.nft-info strong{
  font-size:10px;
}

.nft-info span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:8px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:min(94%,490px);
  height:70px;
  padding:7px 9px;
  display:grid;
  grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;
  align-items:center;
  border:1px solid rgba(239,209,138,.20);
  border-radius:23px;
  background:
    linear-gradient(145deg,rgba(25,23,18,.96),rgba(8,8,7,.97));
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:
    0 15px 45px rgba(0,0,0,.62),
    0 0 30px rgba(239,209,138,.07);
}

.nav-item{
  height:56px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  color:#817969;
  background:transparent;
  font-size:7px;
  letter-spacing:.4px;
}

.nav-item svg{
  width:19px;
  height:19px;
  stroke:currentColor;
}

.nav-item.active{
  color:var(--gold2);
}

.nav-item.active svg{
