<script>
const tg = window.Telegram?.WebApp;
const API_BASE = 'https://nexora-ai-backend-txnv.onrender.com';
let currentUser = null;
let balance = 0;
let withdrawalSubmitting = false;

if(tg){
  tg.ready();
  tg.expand();
  try{tg.setHeaderColor('#00100a');tg.setBackgroundColor('#00100a')}catch(e){}
}

function getInitData(){ return tg?.initData || ''; }

async function apiFetch(path, options={}){
  const initData=getInitData();
  if(!initData) throw new Error('Please open Nexora AI from Telegram.');
  const headers={
    'Content-Type':'application/json',
    'X-Telegram-Init-Data':initData,
    ...(options.headers||{})
  };
  const res=await fetch(API_BASE+path,{...options,headers});
  let data={};
  try{data=await res.json()}catch(e){}
  if(!res.ok || data.success===false) throw new Error(data.message||`Request failed (${res.status})`);
  return data;
}

function telegramName(){
  const u=tg?.initDataUnsafe?.user;
  if(!u) return 'Telegram User';
  const full=[u.first_name,u.last_name].filter(Boolean).join(' ').trim();
  return full || (u.username ? '@'+u.username : 'Telegram User');
}

document.getElementById('userName').textContent=telegramName();

function applyUser(user){
  if(!user)return;
  currentUser=user;
  balance=Number(user.balance||0);
  document.getElementById('userName').textContent=[user.first_name,user.last_name].filter(Boolean).join(' ').trim() || (user.username?'@'+user.username:'Telegram User');
  document.getElementById('balance').textContent=balance.toFixed(4);
  const usdEl=document.getElementById('usd'); if(usdEl) usdEl.textContent=balance.toFixed(2);
  document.getElementById('todayStatus').textContent='↑ Backend Balance';
  const sb=document.getElementById('statBalance'); if(sb) sb.textContent=balance.toFixed(4);
}

async function syncBackendUser(){
  try{
    const referral_code = new URLSearchParams(location.search).get('startapp') || '';
    const data=await apiFetch('/api/users',{
      method:'POST',
      body:JSON.stringify({referral_code})
    });
    applyUser(data.user);
    return data.user;
  }catch(e){
    console.error('User sync failed:',e);
    showToast(e.message||'Backend connection failed');
    return null;
  }
}

async function refreshBackendUser(){
  return await syncBackendUser();
}

function esc(v){
  return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function openModal(title,text,body){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalText').textContent=text||'';
  document.getElementById('modalBody').innerHTML=body||'';
  document.getElementById('modal').classList.add('show');
  tg?.HapticFeedback?.impactOccurred('light');
}

function openAction(title,text){
  const t=String(title).toLowerCase();
  if(t.includes('withdraw')) return openWithdrawal();
  if(t.includes('deposit')) return openDeposit();
  if(t.includes('referral') || t.includes('invite')) return openReferral();
  if(t.includes('nft')) return openNFT();
  if(t.includes('earning')) return openEarning();
  if(t.includes('claim')) return openClaim();
  if(t.includes('mining')) return openMining();
  if(t.includes('friend')) return openReferral();
  if(t.includes('profile')) return openProfile();
  openModal(title,text,'<button class="primary" onclick="closeModal()">Close</button>');
}

async function openDeposit(){
  openModal('Deposit','Secure deposit history is available; payment creation is not enabled yet.',
    '<div id="depositBody" class="notice" style="padding:15px;border:1px solid #0b7045;border-radius:16px;background:#00130c;color:#c9ddd5">Loading deposit history...</div><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button>');
  try{
    const d=await apiFetch('/api/deposits');
    const rows=(d.deposits||[]).slice(0,10);
    document.getElementById('depositBody').innerHTML = rows.length
      ? rows.map(x => '<div style="padding:9px 0;border-bottom:1px solid #0b4d31"><b>'+esc(Number(x.amount||0).toFixed(4))+' USDT</b> · <span style="color:#71ffa9">'+esc(x.status||'pending')+'</span><br><small>'+esc(x.created_at||'')+'</small></div>').join('')
      : 'No deposit records yet.<br><br>No fake wallet address or payment confirmation is shown. A secure deposit-create/payment route must be added before accepting payments.';
  }catch(e){
    document.getElementById('depositBody').textContent=e.message||'Could not load deposit history';
  }
}

async function openReferral(){
  openModal('Referral','Loading your referral data...','<div class="notice">Please wait...</div>');
  try{
    const d=await apiFetch('/api/referral');
    const code=esc(d.referral_code||'');
    const count=Number(d.referral_count||0);
    const commission=Number(d.total_commission||0).toFixed(4);
    openModal('Referral Program','5% commission is credited only when a referred user successfully purchases an NFT.',
      '<div class="notice" style="padding:15px;border:1px solid #0b7045;border-radius:16px;background:#00130c">'+
      '<div style="color:#9fffc1;font-size:13px">YOUR REFERRAL CODE</div>'+
      '<div class="field" style="display:block;font-weight:900;font-size:18px">'+code+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
      '<div style="padding:12px;border:1px solid #0b7045;border-radius:12px">Referrals<br><b style="color:#71ffa9;font-size:20px">'+count+'</b></div>'+
      '<div style="padding:12px;border:1px solid #0b7045;border-radius:12px">NFT Commission<br><b style="color:#71ffa9;font-size:20px">'+commission+' USDT</b></div>'+
      '</div></div>'+
      '<button class="primary" style="margin-top:12px" onclick="copyText(\''+code.replace(/'/g,"\\'")+'\')">Copy Referral Code</button>');
  }catch(e){ openModal('Referral','Could not load referral data.','<div class="notice">'+esc(e.message)+'</div><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button>'); }
}

function copyText(v){
  if(navigator.clipboard) navigator.clipboard.writeText(v);
  showToast('Referral code copied');
}

function openWithdrawal(){
  openModal('Withdrawal','Submit a withdrawal request to the backend.','<div class="form-row"><label>Amount (USDT)</label><input id="wdAmount" class="field" type="number" min="0" step="0.0001" placeholder="Enter amount"></div><div class="form-row"><label>Wallet address</label><input id="wdAddress" class="field" type="text" placeholder="Enter wallet address"></div><button class="primary" onclick="submitWithdrawal()">Submit Withdrawal</button><button class="primary" style="margin-top:10px;background:#073b26;color:#dfffee" onclick="loadWithdrawalHistory()">Withdrawal History</button><div id="wdStatus" style="margin-top:12px;color:#b8cec4"></div>');
}

async function submitWithdrawal(){
  const amount=Number(document.getElementById('wdAmount').value||0);
  const address=String(document.getElementById('wdAddress').value||'').trim();
  const status=document.getElementById('wdStatus');
  if(!amount || amount<=0){status.textContent='Enter a valid amount.';return;}
  if(address.length<10){status.textContent='Enter a valid wallet address.';return;}
  if(withdrawalSubmitting) return;
  withdrawalSubmitting=true;
  status.textContent='Submitting...';
  const btn=document.querySelector('#wdStatus')?.previousElementSibling;
  if(btn) btn.disabled=true;
  try{
    const d=await apiFetch('/api/withdrawals',{method:'POST',body:JSON.stringify({amount,address})});
    if(d.user) applyUser(d.user);
    status.textContent='Withdrawal request submitted and marked pending.';
    showToast('Withdrawal submitted');
    setTimeout(closeModal,700);
  }catch(e){status.textContent=e.message||'Withdrawal failed';
  }finally{
    withdrawalSubmitting=false;
    const btn=document.querySelector('#wdStatus')?.previousElementSibling;
    if(btn) btn.disabled=false;
  }
}

async function loadWithdrawalHistory(){
  const status=document.getElementById('wdStatus');
  status.textContent='Loading withdrawal history...';
  try{
    const d=await apiFetch('/api/withdrawals');
    const rows=(d.withdrawals||[]).slice(0,10);
    if(!rows.length){
      status.innerHTML='<div style="padding:12px;border:1px solid #0b7045;border-radius:12px">No withdrawal requests yet.</div>';
      return;
    }
    status.innerHTML=rows.map(w =>
      '<div style="padding:10px 0;border-bottom:1px solid #0b4d31">'+
      '<b>'+esc(Number(w.amount||0).toFixed(4))+' USDT</b> · '+
      '<span style="color:#71ffa9">'+esc(w.status||'pending')+'</span><br>'+
      '<small>'+esc(w.created_at||'')+'</small></div>'
    ).join('');
  }catch(e){
    status.textContent=e.message||'Could not load withdrawal history';
  }
}

function openEarning(){
  openModal('Earning USDT','Current backend status',
    '<div class="notice" style="padding:15px;border:1px solid #0b7045;border-radius:16px;background:#00130c">Backend balance: <b style="color:#71ffa9">'+balance.toFixed(4)+' USDT</b><br><br>The current backend does not yet contain an automatic earning engine/credit route, so no earnings are fabricated in the UI.</div><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button>');
}

function openClaim(){
  openModal('Claim Rewards','Claim button is active, but the current backend has no claim endpoint yet.',
    '<div class="notice" style="padding:15px;border:1px solid #0b7045;border-radius:16px;background:#00130c">No local balance is increased. A secure claim/reward API must be added before real claims are enabled.</div><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button>');
}

function openMining(){
  openModal('Live Mining','Mining dashboard',
    '<div class="mining"><div class="mineRow"><div class="bolt">ϟ</div><div style="flex:1"><div class="mineName">AI Mining Engine</div><div class="sub">Frontend status display</div></div><div class="rate">ACTIVE</div></div><div style="margin-top:14px;color:#b9cbc4">The current backend does not yet credit automatic mining earnings.</div></div><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button>');
}

async function openNFT(){
  openModal('NFT Collection','Loading the premium Nexora AI NFT collection...','<div class="notice">Loading 9 NFT tiers...</div>');
  try{
    const d=await apiFetch('/api/nft/catalog');
    const nfts=d.nfts||[];
    const rarityByName={Bronze:'Common',Silver:'Rare',Gold:'Rare',Platinum:'Epic',Diamond:'Epic',Heroic:'Legendary',Master:'Legendary','Elite Master':'Mythic','Grand Master':'Mythic'};
    const cards=nfts.map((n,i)=>{
      const rate=Number(n.daily_rate||0).toFixed(2);
      const price=Number(n.price||0).toFixed(2);
      const rarity=rarityByName[n.name]||'Rare';
      return '<article class="nftCard" data-rarity="'+esc(rarity)+'">'+
        '<div class="nftVisual"><span class="nftRarity">'+esc(rarity.toUpperCase())+'</span><b>N</b><small>NEXORA AI • NFT #'+String(i+1).padStart(2,'0')+'</small></div>'+
        '<div class="nftHead"><div class="nftBadge">'+String(i+1).padStart(2,'0')+'</div><div class="nftName">'+esc(n.name)+'</div><div class="nftPrice">'+price+' USDT</div></div>'+
        '<div class="nftMeta"><span>Duration<br><b>'+Number(n.duration_days||0)+' days</b></span><span>Daily Rate<br><b class="rate">'+rate+'%</b></span></div>'+
        '<button class="primary nftBuy" onclick="buyNFT(\''+esc(n.id)+'\')">🛒 Buy Now &nbsp;›</button>'+
      '</article>';
    }).join('');
    openModal('NFT Collection','Own • Earn • Grow — choose a Nexora AI NFT plan using your available backend USDT balance.',
      '<div class="nftHero"><div class="nftHeroRow"><div class="nftHeroLogo"></div><div><h3>Nexora NFT Collection</h3><p>Exclusive tiers • Premium utility • Daily reward rates</p></div><div class="nftHeroStat"><b>9</b><small>Tiers</small></div></div></div>'+ 
      '<div class="nftFilters">'+
      '<button class="nftFilter active" onclick="filterNFTs(this,\'All\')">✦ All</button>'+ 
      '<button class="nftFilter" onclick="filterNFTs(this,\'Common\')">◆ Common</button>'+ 
      '<button class="nftFilter" onclick="filterNFTs(this,\'Rare\')">◇ Rare</button>'+ 
      '<button class="nftFilter" onclick="filterNFTs(this,\'Epic\')">✦ Epic</button>'+ 
      '<button class="nftFilter" onclick="filterNFTs(this,\'Legendary\')">♛ Legendary</button>'+ 
      '<button class="nftFilter" onclick="filterNFTs(this,\'Mythic\')">✧ Mythic</button>'+ 
      '</div>'+ 
      '<div class="nftGrid">'+cards+'</div>'+ 
      '<div class="nftBenefits"><div class="nftBenefit"><b>REAL UTILITY</b>Premium NFT tiers</div><div class="nftBenefit"><b>DAILY RATES</b>Plan based</div><div class="nftBenefit"><b>SECURE</b>Backend verified</div></div>'+ 
      '<div class="nftFooter"><button class="primary nftMineBtn" onclick="loadMyNFTs()">▣ &nbsp; My NFT Purchases &nbsp;›</button></div>');
  }catch(e){
    openModal('NFT Collection','Unable to load NFT plans.','<div class="notice">'+esc(e.message)+'</div><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button>');
  }
}

function filterNFTs(btn, rarity){
  document.querySelectorAll('.nftFilter').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.nftCard').forEach(card=>{
    card.style.display=(rarity==='All'||card.dataset.rarity===rarity)?'block':'none';
  });
  tg?.HapticFeedback?.selectionChanged();
}
async function buyNFT(nftId){
  if(!confirm('Confirm NFT purchase? The NFT price will be deducted from your Nexora backend balance.')) return;
  try{
    const d=await apiFetch('/api/nft/purchase',{method:'POST',body:JSON.stringify({nft_id:nftId})});
    if(d.user_balance!==undefined){
      balance=Number(d.user_balance||0);
      document.getElementById('balance').textContent=balance.toFixed(4);
      const usdEl=document.getElementById('usd'); if(usdEl) usdEl.textContent=balance.toFixed(2);
    }else{
      await refreshBackendUser();
    }
    const commission=Number(d.referral_commission||0);
    showToast('NFT purchased successfully');
    openModal('NFT Purchased','Your NFT purchase was recorded successfully.',
      '<div class="notice" style="padding:15px;border:1px solid #0b7045;border-radius:16px;background:#00130c">'+
      '<b>'+esc(d.purchase?.nft_name||nftId)+'</b><br><br>'+
      'Purchase Price: <b style="color:#71ffa9">'+Number(d.purchase?.price||0).toFixed(2)+' USDT</b><br>'+
      'Duration: <b>'+Number(d.purchase?.duration_days||0)+' days</b><br>'+
      'Daily Rate: <b style="color:#71ffa9">'+Number(d.purchase?.daily_rate||0).toFixed(2)+'%</b><br>'+
      'Referral Commission: <b style="color:#71ffa9">'+commission.toFixed(4)+' USDT</b>'+
      '</div><button class="primary" style="margin-top:14px" onclick="openNFT()">Back to NFT Collection</button>');
  }catch(e){
    openModal('NFT Purchase','Purchase was not completed.','<div class="notice" style="padding:15px;border:1px solid #7a2d2d;border-radius:16px;background:#160909">'+esc(e.message)+'</div><button class="primary" style="margin-top:14px" onclick="openNFT()">Back to NFT Collection</button>');
  }
}

async function loadMyNFTs(){
  try{
    const d=await apiFetch('/api/nft/purchases');
    const rows=d.purchases||[];
    openModal('My NFT Purchases','Your recorded NFT purchases.',
      rows.length ? '<div style="max-height:58vh;overflow:auto">'+rows.map(p=>
        '<div style="padding:12px 0;border-bottom:1px solid #0b4d31"><b>'+esc(p.nft_name)+'</b> · <span style="color:#71ffa9">'+Number(p.price||0).toFixed(2)+' USDT</span><br>'+
        '<small>'+Number(p.duration_days||0)+' days · '+Number(p.daily_rate||0).toFixed(2)+'% daily · '+esc(p.status||'active')+'</small><br>'+
        '<small>'+esc(p.purchased_at||'')+'</small></div>'
      ).join('')+'</div><button class="primary" style="margin-top:12px" onclick="openNFT()">Back to Collection</button>'
      : '<div class="notice">No NFT purchases yet.</div><button class="primary" style="margin-top:14px" onclick="openNFT()">View NFT Plans</button>');
  }catch(e){
    openModal('My NFT Purchases','Unable to load purchases.','<div class="notice">'+esc(e.message)+'</div><button class="primary" style="margin-top:14px" onclick="openNFT()">Back</button>');
  }
}

function openProfile(){
  const name=esc([currentUser?.first_name,currentUser?.last_name].filter(Boolean).join(' ').trim()||telegramName());
  const username=currentUser?.username?('@'+esc(currentUser.username)):'Not set';
  openModal('Profile','Your Nexora account',
    '<div class="notice" style="padding:15px;border:1px solid #0b7045;border-radius:16px;background:#00130c"><b>'+name+'</b><br>'+username+'<br><br>Balance: <span style="color:#71ffa9">'+balance.toFixed(4)+' USDT</span></div><button class="primary" style="margin-top:14px" onclick="openSupport()">Support Help Team</button>');
}

function openSupport(){
  const url='https://t.me/NexoraAI_Pay_bot';
  if(tg?.openTelegramLink) tg.openTelegramLink(url); else window.open(url,'_blank');
}

function openCalculator(){
  openModal('Income Calculator','Enter any amount and your daily/monthly rates to calculate projected income.',
    '<div class="form-row"><label>Capital / Amount (USDT)</label><input id="calcAmount" class="field" type="number" min="0" step="0.0001" value="'+balance.toFixed(4)+'" placeholder="Enter any amount"></div>'+
    '<div class="form-row"><label>Daily %</label><input id="calcDailyRate" class="field" type="number" min="0" step="0.01" value="4" placeholder="Daily %"></div>'+
    '<div class="form-row"><label>Monthly %</label><input id="calcMonthlyRate" class="field" type="number" min="0" step="0.01" placeholder="Monthly % (optional)"></div>'+
    '<div id="calcResult" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px"></div>'+
    '<button class="primary" onclick="calculate()">Calculate</button>');
  calculate();
}

function calculate(){
  const a=Math.max(0,Number(document.getElementById('calcAmount')?.value)||0);
  const dailyRate=Math.max(0,Number(document.getElementById('calcDailyRate')?.value)||0);
  const monthlyInput=document.getElementById('calcMonthlyRate');
  const monthlyRate=monthlyInput && monthlyInput.value!=='' ? Math.max(0,Number(monthlyInput.value)||0) : dailyRate*30;
  const dailyIncome=a*(dailyRate/100);
  const monthlyIncome=a*(monthlyRate/100);
  const totalIncome=a+monthlyIncome;
  const box=(label,value,accent=false)=>'<div style="padding:12px;border:1px solid #0b7045;border-radius:13px;background:#00130c"><small style="color:#b9d3c7">'+label+'</small><br><b style="color:'+(accent?'#71ffa9':'#fff')+';font-size:17px">'+value+'</b></div>';
  const result=document.getElementById('calcResult');
  if(result){
    result.innerHTML=box('Daily %',dailyRate.toFixed(2)+'%')+box('Monthly %',monthlyRate.toFixed(2)+'%')+
      box('Daily Income',dailyIncome.toFixed(4)+' USDT',true)+box('Monthly Income',monthlyIncome.toFixed(4)+' USDT',true)+
      '<div style="grid-column:1/-1">'+box('Total Income',totalIncome.toFixed(4)+' USDT',true)+'</div>';
  }
  showToast('Calculation updated');
}

function closeModal(){document.getElementById('modal').classList.remove('show')}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1900);
}

function navClick(el,name){
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  if(name==='Home'||name==='Nexora'){window.scrollTo({top:0,behavior:'smooth'});return;}
  if(name==='Friend') openReferral();
  if(name==='NFT') openNFT();
  if(name==='Profile') openProfile();
  tg?.HapticFeedback?.selectionChanged();
}

syncBackendUser();
setInterval(refreshBackendUser,30000);
</script>
</body>
</html>
